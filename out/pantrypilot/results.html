<title>PantryPilot Wording Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column with a lab-report rhythm. Summary first, then charts, then the 20 personas behind them. */
:root {
  --bg: #f3f5f7; --surface: #fcfcfb; --ink: #14181c; --ink2: #4a4f55; --muted: #666b72;
  --line: #dfe3e8; --axis: #c3c8cf; --blue: #2a78d6; --blue-ink: #1c5cab; --blue-wash: #e6f0fc;
  --good: #006300; --good-wash: #e3f3e3; --bad: #b02f2f; --bad-wash: #fbe9e9;
  --heat-best: #184f95; --heat-worst: #dbe9fa; --on-best: #ffffff; --on-worst: #14181c;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f11; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a2a59f;
    --line: #2c2c2a; --axis: #383835; --blue: #3987e5; --blue-ink: #86b6ef; --blue-wash: #16263a;
    --good: #3fbf3f; --good-wash: #14301a; --bad: #e66767; --bad-wash: #3a1a1a;
    --heat-best: #9ec5f4; --heat-worst: #184f95; --on-best: #0d0f11; --on-worst: #f0efec; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f11; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a2a59f;
  --line: #2c2c2a; --axis: #383835; --blue: #3987e5; --blue-ink: #86b6ef; --blue-wash: #16263a;
  --good: #3fbf3f; --good-wash: #14301a; --bad: #e66767; --bad-wash: #3a1a1a;
  --heat-best: #9ec5f4; --heat-worst: #184f95; --on-best: #0d0f11; --on-worst: #f0efec; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font);
  padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.15; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 19px; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
p { margin: 0; }
.sub { color: var(--ink2); max-width: 65ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 12.5px/1.4 var(--mono); color: var(--muted); margin-top: 14px; }
.lede { font-size: 17px; line-height: 1.5; max-width: 62ch; margin-top: 14px; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.scroll { overflow-x: auto; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* tested ads */
.ads { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.ad { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ad .tag { font: 500 12px/1 var(--mono); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.ad h3 { font-size: 15px; margin: 0; font-weight: 600; }
.ad blockquote { margin: 0; color: var(--ink2); font-size: 13.5px; line-height: 1.5; }
.ad .rk { font: 500 12.5px/1.3 var(--mono); color: var(--blue-ink); margin-top: auto; }

/* dumbbell chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--ink2); align-items: center; }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.key.r1 { border: 2px solid var(--blue); background: var(--surface); }
.key.r2 { background: var(--blue); }
.dumb { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.drow { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
.drow:first-child { border-top: 0; }
.dl { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 14px; }
.dl b { font-weight: 600; }
.dl span { font: 12.5px/1.5 var(--mono); color: var(--muted); }
.track { position: relative; height: 28px; margin: 0 9px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: var(--axis); border-radius: 1px; }
.span { position: absolute; top: 12px; height: 4px; background: var(--blue); opacity: .35; border-radius: 2px; }
.dot { position: absolute; top: 5px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; cursor: default; }
.dot.r1 { border: 2px solid var(--blue); background: var(--surface); }
.dot.r2 { background: var(--blue); border: 2px solid var(--surface); }
.axis { display: flex; justify-content: space-between; margin: 4px 9px 0; font: 12px/1.2 var(--mono); color: var(--muted); }
.axisnote { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* checks */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12.5px; font-weight: 500; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 12.5px/1 var(--mono); padding: 5px 8px; border-radius: 99px; white-space: nowrap; }
.pill.pass { color: var(--good); background: var(--good-wash); }
.pill.fail { color: var(--bad); background: var(--bad-wash); }
.det { display: block; color: var(--muted); font: 12.5px/1.4 var(--mono); margin-top: 3px; }
.verdict { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 4px; }
.verdict div { display: flex; gap: 8px; align-items: center; font-size: 14px; }

/* heatmap */
.heat td, .heat th { text-align: center; }
.heat td:first-child, .heat th:first-child { text-align: left; }
.cell { font: 500 14px/1 var(--mono); border-radius: 6px; padding: 12px 6px; min-width: 62px; cursor: default; }
.heat td { padding: 4px; border: 0; }
.heat th { border: 0; padding: 4px 4px 8px; font-size: 12.5px; }

/* click bars */
.cb { position: relative; background: var(--blue-wash); border-radius: 4px; height: 26px; min-width: 70px; }
.cb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 4px; opacity: .8; }
.cb span { position: relative; font: 500 12.5px/26px var(--mono); padding-left: 8px; color: var(--ink); }
.nonecol { color: var(--muted); }

/* personas */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 13px/1 var(--font); border: 1px solid var(--line); background: var(--surface); color: var(--ink2); padding: 8px 12px; border-radius: 99px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.people { display: grid; gap: 8px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
summary { cursor: pointer; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; font: 500 16px/1 var(--mono); color: var(--muted); width: 14px; }
details[open] summary::before { content: "\2212"; }
.pn { font-weight: 600; }
.ps { font-size: 13px; color: var(--muted); flex: 1 1 200px; }
.rankstrip { display: flex; gap: 3px; align-items: center; font: 500 11.5px/1 var(--mono); }
.rankstrip span { padding: 4px 5px; border-radius: 4px; background: var(--blue-wash); color: var(--blue-ink); }
.rankstrip span.top { background: var(--blue); color: #fff; }
.rankstrip em { font-style: normal; color: var(--muted); margin: 0 4px; }
.pbody { padding: 0 14px 14px 28px; display: grid; gap: 10px; font-size: 14px; }
.pbody q { quotes: none; display: block; color: var(--ink2); }
.pbody h4 { margin: 0 0 2px; font: 500 12px/1.3 var(--mono); color: var(--muted); }
.facts { font: 12.5px/1.5 var(--mono); color: var(--muted); }

/* graph */
.gwrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.gtype h4 { margin: 0 0 6px; font: 500 12px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.gtype ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.gtype li { background: var(--blue-wash); color: var(--ink); border-radius: 6px; padding: 5px 9px; font-size: 13px; }
.gtype.lim li { background: var(--bad-wash); }
.edges { font: 12.5px/1.7 var(--mono); color: var(--ink2); columns: 2 280px; column-gap: 24px; }
.edges div { break-inside: avoid; }
.edges b { color: var(--ink); font-weight: 500; }
.edges em { font-style: normal; color: var(--blue-ink); }

.notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink2); max-width: 70ch; font-size: 14px; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--bg); font: 12.5px/1.45 var(--mono); padding: 7px 10px; border-radius: 6px; max-width: 260px; opacity: 0; transition: opacity .08s; }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>

<main id="app"></main>

<script>
const D = {"model": "qwen3.8:27b-mlx (local, Ollama)", "n": 20, "hypothesis": "Outcome-led wording that names a SPECIFIC, verifiable result (a number) converts better than feature-led wording, and better than the same outcome stated vaguely, especially among skeptical, price-sensitive people. Urgency/scarcity wording will backfire with skeptics.", "variants": [{"id": "A_feature", "name": "Feature-led", "text": "PantryPilot scans your fridge with your phone camera and generates a 5-dinner weekly plan with a missing-items shopping list. Vegetarian, vegan, gluten-free and dairy-free filters included. $9/month.", "rank1": 2, "rank2": 1.85, "click1": 0.35, "click2": 0.2}, {"id": "B_outcome", "name": "Vague outcome", "text": "Stop throwing food away. Beta users of PantryPilot report wasting less food after 3 months, because every dinner is planned around what's already in your fridge. Try it free for 14 days, then $9/month.", "rank1": 2.8, "rank2": 2.75, "click1": 0.0, "click2": 0.0}, {"id": "B2_outcome_number", "name": "Numeric outcome", "text": "Stop throwing food away. In our 12-week beta, 312 households estimated they wasted about 31% less food (self-reported survey). Every dinner is planned around what's already in your fridge. Try it free for 14 days, then $9/month.", "rank1": 1.65, "rank2": 1.7, "click1": 0.15, "click2": 0.15}, {"id": "C_social", "name": "Social proof", "text": "Join 312 beta households already planning dinners with PantryPilot. Scan your fridge, get 5 dinners in 30 minutes or less. First 14 days free.", "rank1": 3.55, "rank2": 3.7, "click1": 0.0, "click2": 0.0}, {"id": "D_urgency", "name": "Urgency", "text": "Last chance! Founding-member pricing of $9/month ends tonight. Don't waste another week of groceries - start PantryPilot now before the price goes up!", "rank1": 5, "rank2": 5, "click1": 0.0, "click2": 0.0}], "none1": 0.5, "none2": 0.65, "segments": [{"id": "skeptical_budget", "name": "Skeptical budget", "rank2": {"A_feature": 2.2, "B_outcome": 2.4, "B2_outcome_number": 1.8, "C_social": 3.6, "D_urgency": 5}, "click2": {"A_feature": 0.2, "B_outcome": 0.0, "B2_outcome_number": 0.0, "C_social": 0.0, "D_urgency": 0.0}, "none2": 0.8}, {"id": "busy_parent", "name": "Busy parent", "rank2": {"A_feature": 1.4, "B_outcome": 2.8, "B2_outcome_number": 2, "C_social": 3.8, "D_urgency": 5}, "click2": {"A_feature": 0.2, "B_outcome": 0.0, "B2_outcome_number": 0.0, "C_social": 0.0, "D_urgency": 0.0}, "none2": 0.8}, {"id": "eco_idealist", "name": "Eco idealist", "rank2": {"A_feature": 1.6, "B_outcome": 2.8, "B2_outcome_number": 1.6, "C_social": 4, "D_urgency": 5}, "click2": {"A_feature": 0.0, "B_outcome": 0.0, "B2_outcome_number": 0.2, "C_social": 0.0, "D_urgency": 0.0}, "none2": 0.8}, {"id": "tech_enthusiast", "name": "Tech enthusiast", "rank2": {"A_feature": 2.2, "B_outcome": 3, "B2_outcome_number": 1.4, "C_social": 3.4, "D_urgency": 5}, "click2": {"A_feature": 0.4, "B_outcome": 0.0, "B2_outcome_number": 0.4, "C_social": 0.0, "D_urgency": 0.0}, "none2": 0.2}], "checks": {"r1": [{"label": "Numeric outcome beats feature copy by at least 0.3 places", "detail": "Numeric outcome 1.65 vs feature 2", "pass": true}, {"label": "Numeric outcome beats the vague outcome by at least 0.3 places", "detail": "Numeric outcome 1.65 vs vague outcome 2.8", "pass": true}, {"label": "Urgency ranks below numeric outcome for skeptical budget shoppers", "detail": "Urgency 5 vs numeric outcome 1.8", "pass": true}], "r2": [{"label": "Numeric outcome beats feature copy by at least 0.3 places", "detail": "Numeric outcome 1.7 vs feature 1.85", "pass": false}, {"label": "Numeric outcome beats the vague outcome by at least 0.3 places", "detail": "Numeric outcome 1.7 vs vague outcome 2.75", "pass": true}, {"label": "Urgency ranks below numeric outcome for skeptical budget shoppers", "detail": "Urgency 5 vs numeric outcome 1.8", "pass": true}]}, "people": [{"id": "skeptical_budget_0", "name": "Noor Haddad", "age": 24, "job": "Barista", "household": "Single, renting a studio", "budget": 180, "subs": 0, "bio": "I treat every subscription as a trap because I got charged for a 'free' trial streaming service three months ago and didn't notice until it hit my card. I only download apps if they are completely free and ad-supported, and I delete them immediately after I've extracted the value I needed.", "segment": "skeptical_budget", "r1": {"ranking": ["A_feature", "B_outcome", "B2_outcome_number", "C_social", "D_urgency"], "click": null, "interest": {"C_social": 1, "D_urgency": 1, "B_outcome": 2, "A_feature": 2, "B2_outcome_number": 1}, "reasoning": "Every single ad screams 'subscription trap' with phrases like 'founding member pricing' and '14 days free,' which immediately triggers my PTSD from that streaming service bill; I don't care about 'beta households' or 'founding members' when I'm trying to make $180 last a month. I would ignore all of them because none of them offer a free, ad-supported version, and the 'camera scan' feature sounds like a privacy nightmare for a studio renter who just wants to know what to cook with the eggs and spinach I already have.", "objection": "The '14 days free' is a lie designed to charge me $9/month later, and I have zero tolerance for subscriptions I didn't explicitly choose to keep."}, "r2": {"ranking": ["A_feature", "B_outcome", "B2_outcome_number", "C_social", "D_urgency"], "click": null, "interest": {"C_social": 1, "D_urgency": 1, "B_outcome": 2, "A_feature": 3, "B2_outcome_number": 1}, "reasoning": "I don't care about 'founding member' pressure or vague stats; I just want to know what the app actually does without the sales pitch. Ad 4 is the only one that lists the features clearly, but I'm still not clicking because I know 'free' is just a trap for my card.", "objection": "The 'free' trial is a lie designed to charge me later, and I don't need an app to tell me what's in my fridge."}}, {"id": "skeptical_budget_1", "name": "Callum Reid", "age": 38, "job": "IT Support Technician", "household": "Couple, no kids", "budget": 350, "subs": 1, "bio": "As someone in tech, I know exactly how data is harvested, so I\u2019m immune to emotional marketing and refuse to pay for conveniences I can build myself. We only keep one shared subscription because splitting the cost is the only way it makes financial sense, and we monitor our bank statements weekly to catch any rogue renewals.", "segment": "skeptical_budget", "r1": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": "A_feature", "interest": {"B_outcome": 1, "C_social": 2, "D_urgency": 1, "A_feature": 3, "B2_outcome_number": 1}, "reasoning": "The emotional manipulation and urgency in Ad 3 are instant red flags that I would block, while Ad 4's dry, feature-focused list is the only one that respects my intelligence by explaining the actual utility without the fluff. Even then, the $9/month price tag is a non-starter for me since I can build a similar script in an afternoon, but I'd at least read the specs to see if the camera recognition is actually good.", "objection": "The $9/month subscription model is economically irrational for a tool that lacks integration with grocery delivery APIs, meaning I still have to manually shop and cook, so the 'convenience' is negligible."}, "r2": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": "A_feature", "interest": {"B_outcome": 2, "C_social": 2, "D_urgency": 1, "A_feature": 4, "B2_outcome_number": 2}, "reasoning": "Fatima's point that Ad 4 describes a tangible process without the fluff of self-reported stats or urgency tactics aligns with my preference for functional clarity over emotional manipulation. As a tech worker, I value the direct input-output logic of scanning a fridge to generate a list, which is a utility I can evaluate on its merits rather than being pressured by 'founding member' scams or vague promises.", "objection": "The camera permission required to scan the fridge is a significant privacy risk, and I need to know if the image data is processed locally on-device or sent to a cloud server for storage."}}, {"id": "skeptical_budget_2", "name": "Marguerite Dubois", "age": 35, "job": "Part-time Retail Clerk", "household": "Single parent, two young kids", "budget": 280, "subs": 0, "bio": "I don't have time to be a consumer, let alone a target for predatory auto-renewal policies that eat into my childcare budget. I ignore all push notifications and only use apps that offer a permanent free tier, viewing any 'upgrade' prompt as a scam trying to take advantage of busy parents.", "segment": "skeptical_budget", "r1": {"ranking": ["B2_outcome_number", "B_outcome", "C_social", "A_feature", "D_urgency"], "click": null, "interest": {"A_feature": 1, "C_social": 1, "D_urgency": 1, "B_outcome": 1, "B2_outcome_number": 1}, "reasoning": "I am completely uninterested in any ad that suggests a monthly fee, as I have zero budget for subscriptions and view them as predatory traps for busy parents. While the concept of scanning a fridge is convenient, the 'free trial' language in Ad 5 is a red flag that likely leads to auto-renewal, so I ignore all of them.", "objection": "The mention of a $9/month price and 'free trial' implies a commitment I cannot afford and do not want, as I strictly avoid any service that requires a subscription or has hidden costs."}, "r2": {"ranking": ["B2_outcome_number", "B_outcome", "C_social", "A_feature", "D_urgency"], "click": null, "interest": {"A_feature": 1, "C_social": 1, "D_urgency": 1, "B_outcome": 1, "B2_outcome_number": 1}, "reasoning": "Maria's comment about Ad 5 respecting time by being clear is nice, but she's ignoring the elephant in the room: it's still a $9/month subscription trap that I cannot afford. I don't care about 'beta' status or 'founding member' pricing; those are just hooks for auto-renewals that will drain my childcare budget, so I remain completely uninterested in any of these predatory offers.", "objection": "The mandatory $9/month auto-renewal fee makes this app financially inaccessible and predatory for a single parent on a tight budget."}}, {"id": "skeptical_budget_3", "name": "Kavita Menon", "age": 72, "job": "Retired Accountant", "household": "Lives alone", "budget": 200, "subs": 0, "bio": "I fixed my phone settings to block all permissions and auto-payments the day after a fitness app tried to charge me $30 without explicit consent. I stick to the same three grocery stores and cash or check, because I trust tangible money more than digital ledgers that can be manipulated by 'forgot to cancel' clauses.", "segment": "skeptical_budget", "r1": {"ranking": ["B2_outcome_number", "B_outcome", "C_social", "A_feature", "D_urgency"], "click": null, "interest": {"B2_outcome_number": 1, "A_feature": 1, "D_urgency": 1, "C_social": 1, "B_outcome": 1}, "reasoning": "I have no interest in apps that require camera permissions or auto-charges, as I blocked these features after being scammed by a fitness app. The 'founding member' urgency in Ad 3 feels like a scam, and I do not trust self-reported statistics or digital ledgers.", "objection": "The app requires camera access and monthly payments, both of which I have explicitly blocked on my device to prevent unauthorized charges and data harvesting."}, "r2": {"ranking": ["B2_outcome_number", "B_outcome", "C_social", "A_feature", "D_urgency"], "click": null, "interest": {"B2_outcome_number": 1, "A_feature": 1, "D_urgency": 1, "C_social": 1, "B_outcome": 1}, "reasoning": "Marguerite's warning about 'free trial' traps confirms my fear that these apps are designed to bypass my permission blocks and auto-charge me, which is why I refuse to engage with any of them. I do not need a digital ledger to tell me what is in my fridge; I trust my own memory and tangible cash far more than a camera that requires permissions I have explicitly revoked.", "objection": "The 'free trial' mechanism is a predatory trap that likely bypasses my phone's permission blocks to auto-renew and charge me without explicit consent, which I will never allow."}}, {"id": "skeptical_budget_4", "name": "Fatima Al-Sayed", "age": 65, "job": "Retired Teacher", "household": "Three generations in one household", "budget": 450, "subs": 0, "bio": "I manage the household finances for my adult children and grandchildren, so I am ruthless about cutting any recurring digital costs that don't have a physical, verifiable output. I view most app subscriptions as a modern equivalent of a pyramid scheme, and I actively teach my family to avoid the 'subscription fatigue' trap.", "segment": "skeptical_budget", "r1": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": "A_feature", "interest": {"B_outcome": 2, "A_feature": 4, "C_social": 2, "B2_outcome_number": 3, "D_urgency": 1}, "reasoning": "I am not fooled by vague claims or pressure tactics; I only trust what I can physically verify, and Ad 2 is the only one that describes a tangible process (camera scan to physical list) without relying on self-reported statistics or fear-mongering. As a retired teacher managing a tight budget for three generations, I need to see exactly how this tool saves money on paper, not just hear promises about 'beta households' or 'founding members' which sound like modern pyramid schemes.", "objection": "Even if the scan works, I don't trust a digital app to accurately identify ingredients in my fridge, and I refuse to pay a recurring subscription for a service that doesn't deliver physical goods, as it adds to the 'subscription fatigue' I actively try to eliminate."}, "r2": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": null, "interest": {"B_outcome": 1, "A_feature": 1, "C_social": 1, "B2_outcome_number": 1, "D_urgency": 1}, "reasoning": "I am appalled that Wei Zhang and Zainab Yusuf have misread the ads entirely, claiming Ad 5 contains dietary filte function checksTable() {
  const rows = D.checks.r1.map((c, i) => {
    const a = D.checks.r1[i], b = D.checks.r2[i];
    const pill = c => `<span class="pill ${c.pass ? "pass" : "fail"}">${c.pass ? "&#10003; Pass" : "&#10005; Fail"}</span><span class="det">${esc(c.detail)}</span>`;
    return `<tr><td>${esc(a.label)}</td><td>${pill(a)}</td><td>${pill(b)}</td></tr>`;
  }).join("");
  return `<div class="scroll"><table><thead><tr><th>Test</th><th>Round 1<br>(independent)</th><th>After peers</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function dumbbell() {
  const rows = D.variants.slice().sort((a, b) => a.rank2 - b.rank2).map(v => {
    const x = r => ((r - 1) / 4 * 100);
    const lo = Math.min(v.rank1, v.rank2), hi = Math.max(v.rank1, v.rank2);
    return `<div class="drow"><div class="dl"><b>${esc(v.name)}</b><span>round 1 ${f2(v.rank1)} &rarr; after peers ${f2(v.rank2)}</span></div>
      <div class="track">
        <div class="span" style="left:${x(lo)}%;width:${x(hi) - x(lo)}%"></div>
        <div class="dot r1" style="left:${x(v.rank1)}%" data-tip="${esc(v.name)} | round 1 | average position ${f2(v.rank1)}"></div>
        <div class="dot r2" style="left:${x(v.rank2)}%" data-tip="${esc(v.name)} | after peers | average position ${f2(v.rank2)}"></div>
      </div></div>`;
  }).join("");
  return `<div class="legend"><span><i class="key r1"></i>Round 1, judged alone</span><span><i class="key r2"></i>After reading 3 peers</span></div>
    <div class="dumb">${rows}</div>
    <div class="axis"><span>1st</span><span>2nd</span><span>3rd</span><span>4th</span><span>5th</span></div>
    <div class="axisnote"><span>&larr; ranked higher</span><span>ranked lower &rarr;</span></div>`;
}

function heat() {
  const head = D.variants.map(v => `<th>${esc(v.name)}</th>`).join("");
  const rows = D.segments.map(s => {
    const cells = D.variants.map(v => {
      const r = s.rank2[v.id], t = 1 - (r - 1) / 4;
      return `<td><div class="cell" style="background:color-mix(in oklab, var(--heat-best) ${(t * 100).toFixed(0)}%, var(--heat-worst));color:var(${t > 0.5 ? "--on-best" : "--on-worst"})" data-tip="${esc(s.name)} | ${esc(v.name)} | average position ${f2(r)}">${f2(r)}</div></td>`;
    }).join("");
    return `<tr><td>${esc(s.name)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="scroll"><table class="heat"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="sub" style="font-size:13px">Average position after peers, 1 = best. Darker cells rank higher. Five personas per row.</p>`;
}

function clicks() {

  const bar = x => `<div class="cb"><i style="width:${x * 100}%"></i><span>${pct(x)}</span></div>`;
  const rows = D.segments.map(s => `<tr><td>${esc(s.name)}</td>${D.variants.map(v => `<td>${bar(s.click2[v.id])}</td>`).join("")}<td class="nonecol">${bar(s.none2)}</td></tr>`).join("");

  return `<div class="scroll"><table><thead><tr><th></th>${head}</tr></thead><tbody>${rows}${tot}</tbody></table></div>`;
}

function personaCard(p) {
  const strip = r => r.ranking.map((v, i) => `<span class="${i === 0 ? "top" : ""}">${esc(short(v))}</span>`).join("");

      <div><h4>AFTER PEERS &middot; would click: ${esc(click(p.r2))}${changed ? " &middot; changed their ranking" : " &middot; ranking unchanged"}</h4><q>${esc(p.r2.reasoning)}</q></div>
    </div></details>`;
}

function graph() {
  const types = {};
  D.graph.nodes.forEach(n => (types[n.type] = types[n.type] || []).push(n.id));
  const order = ["product", "feature", "price", "audience", "claim", "limitation"];
  const keys = Object.keys(types).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99);
  const groups = keys.map(t => `<div class="gtype ${t === "limitation" ? "lim" : ""}"><h4>${esc(t)}s</h4><ul>${types[t].map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`).join("");
  const edges = D.graph.edges.map(e => `<div><b>${esc(e.src)}</b> <em>${esc(String(e.rel).replace(/_/g, " "))}</em> <b>${esc(e.dst)}</b></div>`).join("");
  return `<div class="gwrap">${groups}</div><div class="panel"><div class="edges">${edges}</div></div>`;
}
