<title>SimMarketing Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: MiroFish-style console. Top bar with view switch + step status; graph pane left, step workbench right; black log panel under the workbench. */
:root {
  --bg: #ffffff; --panel: #fafafa; --ink: #111111; --ink2: #4d4d4d; --muted: #6f6f6f;
  --line: #e4e4e4; --line2: #cfcfcf; --accent: #e2522b; --accent-wash: #fdeee9; --navy: #1f3a5f;
  --good: #1a8f3c; --bad: #c43a3a; --blue-wash: #eaf1fb; --grid: #ececec; --console: #0b0b0b; --console-ink: #b9b9b9;
  --n-product: #2a78d6; --n-feature: #1baf7a; --n-price: #eda100; --n-audience: #e87ba4; --n-claim: #6250d6;
  --n-limitation: #e34948; --n-ad: #eb6834; --n-persona: #8a8f98; --edge: #c9ccd1; --edge-hot: #e2522b;
  --heat-best: #184f95; --heat-worst: #dbe9fa; --on-best: #ffffff; --on-worst: #111111;
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e0e; --panel: #151515; --ink: #f0f0ee; --ink2: #c4c4c0; --muted: #9a9a96;
    --line: #262626; --line2: #3a3a3a; --accent: #f0714d; --accent-wash: #2d1a14; --navy: #9ec5f4;
    --good: #4cc56c; --bad: #ee7676; --blue-wash: #14223a; --grid: #1c1c1c; --console: #050505; --console-ink: #a8a8a8;
    --n-product: #3987e5; --n-feature: #199e70; --n-price: #c98500; --n-audience: #d55181; --n-claim: #9085e9;
    --n-limitation: #e66767; --n-ad: #d95926; --n-persona: #9a9fa8; --edge: #3a3d42; --edge-hot: #f0714d;
    --heat-best: #9ec5f4; --heat-worst: #184f95; --on-best: #0e0e0e; --on-worst: #f0f0ee; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e0e; --panel: #151515; --ink: #f0f0ee; --ink2: #c4c4c0; --muted: #9a9a96;
  --line: #262626; --line2: #3a3a3a; --accent: #f0714d; --accent-wash: #2d1a14; --navy: #9ec5f4;
  --good: #4cc56c; --bad: #ee7676; --blue-wash: #14223a; --grid: #1c1c1c; --console: #050505; --console-ink: #a8a8a8;
  --n-product: #3987e5; --n-feature: #199e70; --n-price: #c98500; --n-audience: #d55181; --n-claim: #9085e9;
  --n-limitation: #e66767; --n-ad: #d95926; --n-persona: #9a9fa8; --edge: #3a3d42; --edge-hot: #f0714d;
  --heat-best: #9ec5f4; --heat-worst: #184f95; --on-best: #0e0e0e; --on-worst: #f0f0ee; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
.mono { font-family: var(--mono); }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; flex: none; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.brand { font: 700 14px/1 var(--mono); letter-spacing: .08em; white-space: nowrap; }
.brand span { font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 10px; }
@media (max-width: 1100px) { .brand span { display: none; } }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; font: 500 12px/1 var(--font); border-radius: 6px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.seg button:focus-visible, .chip:focus-visible, .tab:focus-visible, .ghost:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { display: flex; align-items: center; gap: 10px; font: 12px/1 var(--mono); color: var(--ink2); white-space: nowrap; }
.status b { font-weight: 500; color: var(--ink); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }

/* panes */
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
.shell[data-view="graph"] { grid-template-columns: 1fr 0fr; }
.shell[data-view="work"] { grid-template-columns: 0fr 1fr; }
.shell[data-view="graph"] .work, .shell[data-view="work"] .graphpane { display: none; }
.graphpane { position: relative; border-right: 1px solid var(--line); min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 18px 18px; }
.gtitle { position: absolute; left: 14px; top: 12px; font: 500 12px/1 var(--mono); z-index: 2; }
.gtools { position: absolute; right: 12px; top: 8px; display: flex; gap: 6px; z-index: 2; }
.ghost { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; font: 500 11.5px/1 var(--mono); cursor: pointer; color: var(--ink2); }
.ghost:hover { border-color: var(--line2); color: var(--ink); }
#gsvg { flex: 1; min-height: 0; width: 100%; display: block; touch-action: manipulation; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-width: calc(100% - 24px); z-index: 2; }
.legend h4 { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; color: var(--accent); margin-bottom: 8px; }
.legend div { display: flex; flex-wrap: wrap; gap: 5px 14px; font-size: 12px; color: var(--ink2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.legend i.sq { border-radius: 2px; }
.legend label { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--ink2); cursor: pointer; }
.detail { position: absolute; right: 12px; top: 46px; width: min(300px, calc(100% - 24px)); max-height: calc(100% - 140px); overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.12); z-index: 3; font-size: 12.5px; }
.detail[hidden] { display: none; }
.dh { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.dh button { border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted); padding: 0 2px; }
.tpill { color: #fff; font: 500 10.5px/1 var(--mono); padding: 4px 8px; border-radius: 99px; margin-left: auto; margin-right: 8px; }
.dbody { padding: 10px 12px; display: grid; gap: 8px; }
.kv { display: grid; grid-template-columns: 78px 1fr; gap: 8px; }
.kv span:first-child { color: var(--muted); }
.dbody .sum { color: var(--ink2); line-height: 1.55; }

/* workbench */
.work { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.steps { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ch { display: flex; align-items: baseline; gap: 10px; }
.ch .no { font: 500 13px/1 var(--mono); color: var(--accent); }
.ch h2 { font-size: 15px; font-weight: 600; flex: 1; }
.badge { font: 500 10.5px/1 var(--mono); letter-spacing: .04em; border: 1px solid var(--line2); border-radius: 4px; padding: 4px 7px; color: var(--ink2); white-space: nowrap; }
.badge.ok { color: var(--good); border-color: var(--good); }
.api { font: 11.5px/1.4 var(--mono); color: var(--muted); }
.desc { color: var(--ink2); font-size: 13px; max-width: 70ch; }
.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.trio div { padding: 12px; text-align: center; border-left: 1px solid var(--line); }
.trio div:first-child { border-left: 0; }
.trio b { display: block; font: 500 24px/1.1 var(--mono); }
.trio span { font-size: 11.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink2); border-radius: 99px; padding: 6px 11px; font: 500 12px/1 var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.tag i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; max-height: 420px; overflow: auto; padding: 2px; }
.pc { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pc:hover, .pc.sel { border-color: var(--accent); }
.pc .n { font-weight: 600; font-size: 13px; }
.pc .h { font: 11px/1.3 var(--mono); color: var(--muted); }
.pc .t { font-size: 11px; font: 500 10.5px/1 var(--mono); color: var(--accent); }
.pc p { font-size: 12px; color: var(--ink2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cfg { display: grid; border: 1px solid var(--line); border-radius: 8px; }
.cfg div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.cfg div:first-child { border-top: 0; }
.cfg span:last-child { font: 12.5px/1.5 var(--mono); text-align: right; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--line); background: var(--bg); padding: 6px 12px; border-radius: 6px; font: 500 12px/1 var(--mono); cursor: pointer; color: var(--muted); }
.tab[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.feed { display: grid; gap: 8px; max-height: 380px; overflow: auto; padding-right: 4px; }
.ev { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; background: var(--panel); }
.ev .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 500 11px/1.2 var(--mono); color: var(--muted); }
.ev .top b { color: var(--ink); font-weight: 500; }
.ev p { font-size: 12.5px; color: var(--ink2); }
.rk { display: inline-flex; gap: 3px; }
.rk span { font: 500 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 4px; background: var(--blue-wash); color: var(--ink2); }
.rk span.t1 { background: var(--ink); color: var(--bg); }

/* report */
.doc { display: grid; gap: 14px; }
.doc .kicker { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; border: 1px solid var(--ink); display: inline-block; padding: 4px 7px; width: fit-content; }
.doc h3 { font-size: clamp(20px, 3.2vw, 26px); line-height: 1.2; font-weight: 600; text-wrap: balance; }
.doc .lede { font-style: italic; color: var(--muted); font-size: 14px; border-left: 2px solid var(--line2); padding-left: 12px; max-width: 65ch; }
.doc h4 { font-size: 14px; font-weight: 600; display: flex; gap: 10px; }
.doc h4 em { font: 500 12px/1.6 var(--mono); color: var(--muted); font-style: normal; }
.doc p, .doc li { font-size: 13.5px; color: var(--ink2); max-width: 68ch; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
blockquote { margin: 0; padding: 8px 12px; background: var(--panel); border-left: 2px solid var(--line2); font-size: 12.5px; color: var(--ink2); font-style: italic; }
blockquote cite { display: block; font: 11px/1.4 var(--mono); font-style: normal; color: var(--muted); margin-top: 4px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 11px/1.3 var(--mono); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 99px; white-space: nowrap; }
.pill.pass { color: var(--good); background: color-mix(in oklab, var(--good) 14%, transparent); }
.pill.fail { color: var(--bad); background: color-mix(in oklab, var(--bad) 14%, transparent); }
.det { display: block; color: var(--muted); font: 11px/1.4 var(--mono); margin-top: 3px; }
.drow { padding: 8px 0; border-top: 1px solid var(--line); }
.drow:first-child { border-top: 0; }
.dl { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 13px; }
.dl span { font: 11.5px/1.5 var(--mono); color: var(--muted); }
.track { position: relative; height: 24px; margin: 0 8px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: var(--line2); }
.span { position: absolute; top: 10px; height: 4px; background: var(--accent); opacity: .35; border-radius: 2px; }
.dt { position: absolute; top: 4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; }
.dt.a { border: 2px solid var(--accent); background: var(--bg); }
.dt.b { background: var(--accent); border: 2px solid var(--bg); }
.axis { display: flex; justify-content: space-between; margin: 4px 8px 0; font: 11px/1 var(--mono); color: var(--muted); }
.lg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink2); }
.lg i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.lg i.a { border: 2px solid var(--accent); } .lg i.b { background: var(--accent); }
.heat td { padding: 3px; border: 0; text-align: center; } .heat th { border: 0; text-align: center; padding: 3px 3px 6px; }
.heat td:first-child, .heat th:first-child { text-align: left; }
.cell { font: 500 12.5px/1 var(--mono); border-radius: 5px; padding: 10px 4px; min-width: 52px; }
.btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 12px 14px; font: 500 13px/1 var(--font); cursor: pointer; width: 100%; }

/* chat */
select { font: 500 13px/1 var(--font); border: 1px solid var(--line2); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; max-width: 100%; }
.chat { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--panel); max-height: 360px; overflow: auto; }
.bub { max-width: 88%; padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
.bub.u { justify-self: end; background: var(--ink); color: var(--bg); }
.bub.p { justify-self: start; background: var(--bg); border: 1px solid var(--line); color: var(--ink2); }
.bub small { display: block; font: 10.5px/1.2 var(--mono); color: var(--muted); margin-bottom: 4px; }
.fakein { display: flex; gap: 8px; }
.fakein input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; font: 13px var(--font); color: var(--muted); }

/* console */
.console { flex: none; background: var(--console); color: var(--console-ink); border-top: 1px solid var(--line); }
.console header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; color: #8a8a8a; cursor: pointer; border: 0; width: 100%; background: transparent; text-align: left; }
.console pre { margin: 0; padding: 0 14px 12px; font: 11.5px/1.65 var(--mono); height: 120px; overflow: auto; white-space: pre; }
.console.closed pre { display: none; }
.console pre .k { color: #6f6f6f; }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; }
  html { height: auto; }
  .shell, .shell[data-view="graph"], .shell[data-view="work"], .shell[data-view="split"] { display: block; }
  .graphpane { height: 62vh; min-height: 380px; border-right: 0; border-bottom: 1px solid var(--line); }
  .steps { overflow: visible; }
  .status span.long { display: none; }
  .console pre { height: 90px; }
}
@media (max-width: 520px) { .brand { font-size: 12px; } .seg button { padding: 6px 9px; } .status { display: none; } }
@media (prefers-reduced-motion: reduce) { .steps { scroll-behavior: auto; } }
</style>

<div class="bar">
  <div class="brand">SIMMARKETING<span id="proj"></span></div>
  <div class="seg" id="viewseg" role="group" aria-label="View"><button data-v="graph" aria-pressed="false">Graph</button><button data-v="split" aria-pressed="true">Split</button><button data-v="work" aria-pressed="false">Workbench</button></div>
  <div class="status"><span>Step <b id="stepno">1/5</b> <b id="stepname" class="long">Graph build</b></span><span><i class="dot"></i>Completed</span></div>
</div>

<div class="shell" id="shell" data-view="split">
  <section class="graphpane" aria-label="Graph relationship visualization">
    <div class="gtitle">Graph Relationship Visualization</div>
    <div class="gtools"><button class="ghost" id="relayout">Re-layout</button><button class="ghost" id="gfull">Expand</button></div>
    <svg id="gsvg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Knowledge graph of the product brief, ad variants and personas"></svg>
    <div class="legend"><h4>ENTITY TYPES</h4><div id="legend"></div><label><input type="checkbox" id="showp" checked> Show personas and their top-ranked ad</label></div>
    <div class="detail" id="detail" hidden></div>
  </section>

  <section class="work">
    <div class="steps" id="steps"></div>
    <div class="console" id="console"><header id="conhead" aria-expanded="true"><span>CONSOLE OUTPUT</span><span id="conmeta"></span></header><pre id="conlog"></pre></div>
  </section>
</div>

<script>
const D = {"title": "PantryPilot wording test", "model": "qwen3.8:27b-mlx (local, Ollama)", "n": 20, "hypothesis": "Outcome-led wording that names a SPECIFIC, verifiable result (a number) converts better than feature-led wording, and better than the same outcome stated vaguely, especially among skeptical, price-sensitive people. Urgency/scarcity wording will backfire with skeptics.", "variants": [{"id": "A_feature", "name": "Feature-led", "text": "PantryPilot scans your fridge with your phone camera and generates a 5-dinner weekly plan with a missing-items shopping list. Vegetarian, vegan, gluten-free and dairy-free filters included. $9/month.", "rank1": 2, "rank2": 1.85, "click1": 0.35, "click2": 0.2}, {"id": "B_outcome", "name": "Vague outcome", "text": "Stop throwing food away. Beta users of PantryPilot report wasting less food after 3 months, because every dinner is planned around what's already in your fridge. Try it free for 14 days, then $9/month.", "rank1": 2.8, "rank2": 2.75, "click1": 0.0, "click2": 0.0}, {"id": "B2_outcome_number", "name": "Numeric outcome", "text": "Stop throwing food away. In our 12-week beta, 312 households estimated they wasted about 31% less food (self-reported survey). Every dinner is planned around what's already in your fridge. Try it free for 14 days, then $9/month.", "rank1": 1.65, "rank2": 1.7, "click1": 0.15, "click2": 0.15}, {"id": "C_social", "name": "Social proof", "text": "Join 312 beta households already planning dinners with PantryPilot. Scan your fridge, get 5 dinners in 30 minutes or less. First 14 days free.", "rank1": 3.55, "rank2": 3.7, "click1": 0.0, "click2": 0.0}, {"id": "D_urgency", "name": "Urgency", "text": "Last chance! Founding-member pricing of $9/month ends tonight. Don't waste another week of groceries - start PantryPilot now before the price goes up!", "rank1": 5, "rank2": 5, "click1": 0.0, "click2": 0.0}], "none1": 0.5, "none2": 0.65, "segments": [{"id": "skeptical_budget", "name": "Skeptical budget", "rank2": {"A_feature": 2.2, "B_outcome": 2.4, "B2_outcome_number": 1.8, "C_social": 3.6, "D_urgency": 5}, "click2": {"A_feature": 0.2, "B_outcome": 0.0, "B2_outcome_number": 0.0, "C_social": 0.0, "D_urgency": 0.0}, "none2": 0.8}, {"id": "busy_parent", "name": "Busy parent", "rank2": {"A_feature": 1.4, "B_outcome": 2.8, "B2_outcome_number": 2, "C_social": 3.8, "D_urgency": 5}, "click2": {"A_feature": 0.2, "B_outcome": 0.0, "B2_outcome_number": 0.0, "C_social": 0.0, "D_urgency": 0.0}, "none2": 0.8}, {"id": "eco_idealist", "name": "Eco idealist", "rank2": {"A_feature": 1.6, "B_outcome": 2.8, "B2_outcome_number": 1.6, "C_social": 4, "D_urgency": 5}, "click2": {"A_feature": 0.0, "B_outcome": 0.0, "B2_outcome_number": 0.2, "C_social": 0.0, "D_urgency": 0.0}, "none2": 0.8}, {"id": "tech_enthusiast", "name": "Tech enthusiast", "rank2": {"A_feature": 2.2, "B_outcome": 3, "B2_outcome_number": 1.4, "C_social": 3.4, "D_urgency": 5}, "click2": {"A_feature": 0.4, "B_outcome": 0.0, "B2_outcome_number": 0.4, "C_social": 0.0, "D_urgency": 0.0}, "none2": 0.2}], "checks": {"r1": [{"label": "Numeric outcome beats feature copy", "pass": true, "better": "B2_outcome_number", "worse": "A_feature", "detail": "Numeric outcome 1.65 vs Feature-led 2 (gap 0.35, need 0.3)"}, {"label": "Numeric outcome beats the vague outcome", "pass": true, "better": "B2_outcome_number", "worse": "B_outcome", "detail": "Numeric outcome 1.65 vs Vague outcome 2.8 (gap 1.15, need 0.3)"}, {"label": "Urgency ranks below numeric outcome for skeptical budget shoppers", "pass": true, "better": "B2_outcome_number", "worse": "D_urgency", "detail": "Numeric outcome 1.8 vs Urgency 5 (gap 3.2, need 0.01) in Skeptical budget"}], "r2": [{"label": "Numeric outcome beats feature copy", "pass": false, "better": "B2_outcome_number", "worse": "A_feature", "detail": "Numeric outcome 1.7 vs Feature-led 1.85 (gap 0.15, need 0.3)"}, {"label": "Numeric outcome beats the vague outcome", "pass": true, "better": "B2_outcome_number", "worse": "B_outcome", "detail": "Numeric outcome 1.7 vs Vague outcome 2.75 (gap 1.05, need 0.3)"}, {"label": "Urgency ranks below numeric outcome for skeptical budget shoppers", "pass": true, "better": "B2_outcome_number", "worse": "D_urgency", "detail": "Numeric outcome 1.8 vs Urgency 5 (gap 3.2, need 0.01) in Skeptical budget"}]}, "persona_fields": [{"key": "budget_context", "label": "Budget"}], "people": [{"name": "Noor Haddad", "age": 24, "job": "Barista", "household": "Single, renting a studio", "monthly_grocery_budget_usd": 180, "app_subscriptions_owned": 0, "bio": "I treat every subscription as a trap because I got charged for a 'free' trial streaming service three months ago and didn't notice until it hit my card. I only download apps if they are completely free and ad-supported, and I delete them immediately after I've extracted the value I needed.", "segment": "skeptical_budget", "id": "skeptical_budget_0", "r1": {"ranking": ["A_feature", "B_outcome", "B2_outcome_number", "C_social", "D_urgency"], "click": null, "interest": {"C_social": 1, "D_urgency": 1, "B_outcome": 2, "A_feature": 2, "B2_outcome_number": 1}, "reasoning": "Every single ad screams 'subscription trap' with phrases like 'founding member pricing' and '14 days free,' which immediately triggers my PTSD from that streaming service bill; I don't care about 'beta households' or 'founding members' when I'm trying to make $180 last a month. I would ignore all of them because none of them offer a free, ad-supported version, and the 'camera scan' feature sounds like a privacy nightmare for a studio renter who just wants to know what to cook with the eggs and spinach I already have.", "objection": "The '14 days free' is a lie designed to charge me $9/month later, and I have zero tolerance for subscriptions I didn't explicitly choose to keep."}, "r2": {"ranking": ["A_feature", "B_outcome", "B2_outcome_number", "C_social", "D_urgency"], "click": null, "interest": {"C_social": 1, "D_urgency": 1, "B_outcome": 2, "A_feature": 3, "B2_outcome_number": 1}, "reasoning": "I don't care about 'founding member' pressure or vague stats; I just want to know what the app actually does without the sales pitch. Ad 4 is the only one that lists the features clearly, but I'm still not clicking because I know 'free' is just a trap for my card.", "objection": "The 'free' trial is a lie designed to charge me later, and I don't need an app to tell me what's in my fridge."}}, {"name": "Callum Reid", "age": 38, "job": "IT Support Technician", "household": "Couple, no kids", "monthly_grocery_budget_usd": 350, "app_subscriptions_owned": 1, "bio": "As someone in tech, I know exactly how data is harvested, so I\u2019m immune to emotional marketing and refuse to pay for conveniences I can build myself. We only keep one shared subscription because splitting the cost is the only way it makes financial sense, and we monitor our bank statements weekly to catch any rogue renewals.", "segment": "skeptical_budget", "id": "skeptical_budget_1", "r1": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": "A_feature", "interest": {"B_outcome": 1, "C_social": 2, "D_urgency": 1, "A_feature": 3, "B2_outcome_number": 1}, "reasoning": "The emotional manipulation and urgency in Ad 3 are instant red flags that I would block, while Ad 4's dry, feature-focused list is the only one that respects my intelligence by explaining the actual utility without the fluff. Even then, the $9/month price tag is a non-starter for me since I can build a similar script in an afternoon, but I'd at least read the specs to see if the camera recognition is actually good.", "objection": "The $9/month subscription model is economically irrational for a tool that lacks integration with grocery delivery APIs, meaning I still have to manually shop and cook, so the 'convenience' is negligible."}, "r2": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": "A_feature", "interest": {"B_outcome": 2, "C_social": 2, "D_urgency": 1, "A_feature": 4, "B2_outcome_number": 2}, "reasoning": "Fatima's point that Ad 4 describes a tangible process without the fluff of self-reported stats or urgency tactics aligns with my preference for functional clarity over emotional manipulation. As a tech worker, I value the direct input-output logic of scanning a fridge to generate a list, which is a utility I can evaluate on its merits rather than being pressured by 'founding member' scams or vague promises.", "objection": "The camera permission required to scan the fridge is a significant privacy risk, and I need to know if the image data is processed locally on-device or sent to a cloud server for storage."}}, {"name": "Marguerite Dubois", "age": 35, "job": "Part-time Retail Clerk", "household": "Single parent, two young kids", "monthly_grocery_budget_usd": 280, "app_subscriptions_owned": 0, "bio": "I don't have time to be a consumer, let alone a target for predatory auto-renewal policies that eat into my childcare budget. I ignore all push notifications and only use apps that offer a permanent free tier, viewing any 'upgrade' prompt as a scam trying to take advantage of busy parents.", "segment": "skeptical_budget", "id": "skeptical_budget_2", "r1": {"ranking": ["B2_outcome_number", "B_outcome", "C_social", "A_feature", "D_urgency"], "click": null, "interest": {"A_feature": 1, "C_social": 1, "D_urgency": 1, "B_outcome": 1, "B2_outcome_number": 1}, "reasoning": "I am completely uninterested in any ad that suggests a monthly fee, as I have zero budget for subscriptions and view them as predatory traps for busy parents. While the concept of scanning a fridge is convenient, the 'free trial' language in Ad 5 is a red flag that likely leads to auto-renewal, so I ignore all of them.", "objection": "The mention of a $9/month price and 'free trial' implies a commitment I cannot afford and do not want, as I strictly avoid any service that requires a subscription or has hidden costs."}, "r2": {"ranking": ["B2_outcome_number", "B_outcome", "C_social", "A_feature", "D_urgency"], "click": null, "interest": {"A_feature": 1, "C_social": 1, "D_urgency": 1, "B_outcome": 1, "B2_outcome_number": 1}, "reasoning": "Maria's comment about Ad 5 respecting time by being clear is nice, but she's ignoring the elephant in the room: it's still a $9/month subscription trap that I cannot afford. I don't care about 'beta' status or 'founding member' pricing; those are just hooks for auto-renewals that will drain my childcare budget, so I remain completely uninterested in any of these predatory offers.", "objection": "The mandatory $9/month auto-renewal fee makes this app financially inaccessible and predatory for a single parent on a tight budget."}}, {"name": "Kavita Menon", "age": 72, "job": "Retired Accountant", "household": "Lives alone", "monthly_grocery_budget_usd": 200, "app_subscriptions_owned": 0, "bio": "I fixed my phone settings to block all permissions and auto-payments the day after a fitness app tried to charge me $30 without explicit consent. I stick to the same three grocery stores and cash or check, because I trust tangible money more than digital ledgers that can be manipulated by 'forgot to cancel' clauses.", "segment": "skeptical_budget", "id": "skeptical_budget_3", "r1": {"ranking": ["B2_outcome_number", "B_outcome", "C_social", "A_feature", "D_urgency"], "click": null, "interest": {"B2_outcome_number": 1, "A_feature": 1, "D_urgency": 1, "C_social": 1, "B_outcome": 1}, "reasoning": "I have no interest in apps that require camera permissions or auto-charges, as I blocked these features after being scammed by a fitness app. The 'founding member' urgency in Ad 3 feels like a scam, and I do not trust self-reported statistics or digital ledgers.", "objection": "The app requires camera access and monthly payments, both of which I have explicitly blocked on my device to prevent unauthorized charges and data harvesting."}, "r2": {"ranking": ["B2_outcome_number", "B_outcome", "C_social", "A_feature", "D_urgency"], "click": null, "interest": {"B2_outcome_number": 1, "A_feature": 1, "D_urgency": 1, "C_social": 1, "B_outcome": 1}, "reasoning": "Marguerite's warning about 'free trial' traps confirms my fear that these apps are designed to bypass my permission blocks and auto-charge me, which is why I refuse to engage with any of them. I do not need a digital ledger to tell me what is in my fridge; I trust my own memory and tangible cash far more than a camera that requires permissions I have explicitly revoked.", "objection": "The 'free trial' mechanism is a predatory trap that likely bypasses my phone's permission blocks to auto-renew and charge me without explicit consent, which I will never allow."}}, {"name": "Fatima Al-Sayed", "age": 65, "job": "Retired Teacher", "household": "Three generations in one household", "monthly_grocery_budget_usd": 450, "app_subscriptions_owned": 0, "bio": "I manage the household finances for my adult children and grandchildren, so I am ruthless about cutting any recurring digital costs that don't have a physical, verifiable output. I view most app subscriptions as a modern equivalent of a pyramid scheme, and I actively teach my family to avoid the 'subscription fatigue' trap.", "segment": "skeptical_budget", "id": "skeptical_budget_4", "r1": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": "A_feature", "interest": {"B_outcome": 2, "A_feature": 4, "C_social": 2, "B2_outcome_number": 3, "D_urgency": 1}, "reasoning": "I am not fooled by vague claims or pressure tactics; I only trust what I can physically verify, and Ad 2 is the only one that describes a tangible process (camera scan to physical list) without relying on self-reported statistics or fear-mongering. As a retired teacher managing a tight budget for three generations, I need to see exactly how this tool saves money on paper, not just hear promises about 'beta households' or 'founding members' which sound like modern pyramid schemes.", "objection": "Even if the scan works, I don't trust a digital app to accurately identify ingredients in my fridge, and I refuse to pay a recurring subscription for a service that doesn't deliver physical goods, as it adds to the 'subscription fatigue' I actively try to eliminate."}, "r2": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": null, "interest": {"B_outcome": 1, "A_feature": 1, "C_social": 1, "B2_outcome_number": 1, "D_urgency": 1}, "reasoning": "I am appalled that Wei Zhang and Zainab Yusuf have misread the ads entirely, claiming Ad 5 contains dietary filters and transparency when it is actually the most predatory 'founder pricing' scam; this confirms my suspicion that these ads are designed to confuse and manipulate rather than inform. I remain uninterested in any service that requires a camera scan or a monthly fee, as I have no budget for digital subscriptions and view them as a modern pyramid scheme that offers no physical, verifiable output.", "objection": "The fundamental premise that I should pay $9/month for a digital app to manage my household finances is absurd, especially when I can plan meals with a pen and paper for zero cost."}}, {"name": "Idris Mahmoud", "age": 28, "job": "Junior UX Designer", "household": "Shared flat with two housemates", "monthly_grocery_budget_usd": 180, "app_subscriptions_owned": 0, "bio": "I refuse to pay for meal kit subscriptions because the per-serving cost is higher than buying ingredients in bulk and splitting them fairly with my housemates. I only respond to ads that offer immediate, no-nonsense discounts on staples, and I delete any push notification that doesn't save me time or money instantly.", "segment": "busy_parent", "id": "busy_parent_0", "r1": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": "A_feature", "interest": {"D_urgency": 1, "A_feature": 3, "B_outcome": 2, "C_social": 2, "B2_outcome_number": 2}, "reasoning": "I don't care about 'founding member' hype or vague statistics; I only care if this saves me money or time right now. Ad 2 is the only one that explains the actual utility (fridge scan + list) without the 'trust us' fluff, but I'm still skeptical of a $9 subscription when I can just look at my fridge.", "objection": "It's still a paid subscription for a feature I can do for free, and it doesn't solve the problem of splitting costs with my housemates."}, "r2": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": null, "interest": {"D_urgency": 1, "A_feature": 3, "B_outcome": 2, "C_social": 2, "B2_outcome_number": 1}, "reasoning": "Mei-Ling and Marguerite are right to flag the $9/month fee as a dealbreaker; I have zero tolerance for subscriptions that don't save me more than they cost, and 'free trial' is just a trap for auto-renewal. Ad 2 is the only one that highlights the time-saving utility (30 mins for 5 dinners) which is the only reason I'd consider it, but the lack of a clear 'no-cost' or 'bulk-buy' angle makes it unclickable for me.", "objection": "The $9/month fee is predatory for my budget; I refuse to pay for a service when I can just buy ingredients in bulk and split them with housemates for a fraction of the cost."}}, {"name": "Sofia Rinaldi", "age": 36, "job": "Marketing Manager", "household": "Two working parents with a teenager", "monthly_grocery_budget_usd": 450, "app_subscriptions_owned": 2, "bio": "I rely on automated grocery delivery to avoid the chaos of weekend shopping, but I cancel any subscription that doesn't show a clear, monthly savings report. I ignore most brand storytelling; I only engage with ads that highlight 'ready-to-eat' options for my teen or bulk discounts for our large household.", "segment": "busy_parent", "id": "busy_parent_1", "r1": {"ranking": ["B2_outcome_number", "B_outcome", "A_feature", "C_social", "D_urgency"], "click": null, "interest": {"C_social": 2, "B_outcome": 3, "A_feature": 1, "D_urgency": 1, "B2_outcome_number": 3}, "reasoning": "I\u2019m already paying for automated delivery, so an app that only plans meals but requires me to manually shop or order is a step backward, not a solution. Ad 5 is the only one that offers a concrete, quantifiable justification ($ savings via waste reduction) that aligns with my strict requirement for clear financial value, whereas the others rely on vague promises or irrelevant features like dietary filters I don't need.", "objection": "The '31% less waste' claim is self-reported and unverified, and since I have no way to confirm the actual dollar savings or integrate this with my existing delivery system, it fails to prove the monthly savings report I demand."}, "r2": {"ranking": ["B2_outcome_number", "B_outcome", "A_feature", "C_social", "D_urgency"], "click": null, "interest": {"C_social": 1, "B_outcome": 1, "A_feature": 1, "D_urgency": 1, "B2_outcome_number": 1}, "reasoning": "The peers' skepticism about camera permissions and the lack of a clear savings report confirms my instinct to ignore these ads; I don't care about 'beta' status or vague waste reduction claims if I can't verify the ROI against my $450 budget. Since I already have two paid subscriptions and rely on automated delivery, adding a $9/month app that requires manual fridge scanning is an operational burden, not a solution.", "objection": "The ad fails to provide a clear, monthly savings report, which is the only metric I use to justify keeping a subscription active."}}, {"name": "Jamal Washington", "age": 34, "job": "Regional Sales Director", "household": "Single, mid 30s, travels for work", "monthly_grocery_budget_usd": 120, "app_subscriptions_owned": 1, "bio": "I am too tired to cook after business trips, so I rely on one premium food delivery app for convenience, but I am aggressively cutting other subscriptions to manage my solo income. I view most grocery ads as noise unless they offer a 'skip a week' feature or a deep discount on pre-prepared meals that fit my erratic schedule.", "segment": "busy_parent", "id": "busy_parent_2", "r1": {"ranking": ["A_feature", "B_outcome", "B2_outcome_number", "C_social", "D_urgency"], "click": null, "interest": {"B_outcome": 1, "C_social": 1, "D_urgency": 1, "B2_outcome_number": 1, "A_feature": 1}, "reasoning": "I don't have the time or energy to plan meals or scan a fridge; I need food delivered to my door, not a shopping list to execute myself. All five ads fail to address my core need for delivery and convenience, instead pitching a chore I can't afford to do while cutting costs.", "objection": "The app does not deliver food, so it offers zero solution to my primary problem of being too tired to cook after travel."}, "r2": {"ranking": ["A_feature", "B_outcome", "B2_outcome_number", "C_social", "D_urgency"], "click": null, "interest": {"B_outcome": 1, "C_social": 1, "D_urgency": 1, "B2_outcome_number": 1, "A_feature": 2}, "reasoning": "I don't care about 'saving money' on groceries I barely buy; I care about not having to think about dinner after a 14-hour flight. Ad 5 is the only one that actually explains the utility\u2014scanning my fridge to get a plan\u2014without the manipulative urgency of Ad 3 or the vague fluff of the others, so it\u2019s the least offensive, but it still doesn't solve my need for pre-prepared meals.", "objection": "It requires me to do the work of scanning and planning, which is the exact opposite of the convenience I need when I'm exhausted; it doesn't offer pre-prepared meals or a 'skip a week' feature to fit my erratic schedule."}}, {"name": "Mei-Ling Chua", "age": 29, "job": "Accountant", "household": "Newlyweds saving for a house", "monthly_grocery_budget_usd": 200, "app_subscriptions_owned": 0, "bio": "Every dollar counts toward our down payment, so I avoid all subscription models that lock me into recurring fees without guaranteed savings. I only trust ads that clearly compare unit prices, and I will not sign up for any service that requires a credit card on file without a hard opt-out.", "segment": "busy_parent", "id": "busy_parent_3", "r1": {"ranking": ["C_social", "B2_outcome_number", "A_feature", "B_outcome", "D_urgency"], "click": null, "interest": {"C_social": 2, "B2_outcome_number": 1, "B_outcome": 1, "D_urgency": 1, "A_feature": 1}, "reasoning": "I am completely turned off by the recurring $9/month fee in Ads 2, 3, and 5 because it directly conflicts with my strict no-subscription rule for saving on a house; even if they save me money on food, the locked-in fee is a dealbreaker. Ad 1 is the only one that doesn't immediately highlight the monthly cost in the headline, but its vague 'beta' claims and lack of specific data make it feel like a trap rather than a genuine utility.", "objection": "The ad fails to provide a clear unit-price comparison to prove the savings outweigh the cost, and since I cannot verify the '312 beta households' claim or guarantee a hard opt-out without a credit card on file, it violates my core financial principles."}, "r2": {"ranking": ["A_feature", "B2_outcome_number", "C_social", "B_outcome", "D_urgency"], "click": null, "interest": {"C_social": 1, "B2_outcome_number": 1, "B_outcome": 1, "D_urgency": 1, "A_feature": 2}, "reasoning": "The peers' feedback confirms my suspicion that Ad 5 is the most honest, but as an accountant, I am repulsed by the $9/month recurring fee that none of the ads offer a clear opt-out for, and the 'self-reported' data in Ad 2 is too weak to justify a subscription. I remain uninterested in any service that locks me into a credit card charge without a guaranteed, quantified savings comparison that proves it pays for itself within the first month.", "objection": "The $9/month fee is a recurring cost with no hard opt-out or guaranteed savings, which directly conflicts with my strict no-subscription policy for saving for a house."}}, {"name": " hunk of my $150 grocery budget, so I am not signing up now, but I would click to see if the camera feature actually works before considering the cost.", "objection": "The $9/month cost is too high relative to my grocery budget, and I am skeptical that a camera scan will be accurate enough to replace my manual planning without adding overhead."}}, {"name": "Esperanza Cruz", "age": 23, "job": "Barista", "household": "Single, renting a studio", "monthly_grocery_budget_usd": 180, "app_subscriptions_owned": 2, "bio": "Esperanza relies on food-sharing apps to save money and reduce waste, but she is skeptical of brands that use vague 'planet-friendly' language without showing supply chain transparency. She ignores most push notifications unless they offer a direct, tangible benefit like a discount on organic produce.", "segment": "eco_idealist", "id": "eco_idealist_0", "r1": {"ranking": ["B2_outcome_number", "A_feature", "B_outcome", "C_social", "D_urgency"], "click": null, "interest": {"B_outcome": 2, "A_feature": 3, "C_social": 2, "B2_outcome_number": 3, "D_urgency": 1}, "reasoning": "I'm too broke for another $9/month subscription, so Ad 5's pressure tactics are immediate noise, and Ad 1 is too generic to trust. Ad 4 is the only one that feels honest by admitting the waste stats are self-reported, which respects my intelligence, but it still doesn't solve my actual problem: it doesn't order or deliver food.", "objection": "Even if I plan the meals, I still have to go to the store myself, which doesn't help my tight budget or save me time as a busy barista."}, "r2": {"ranking": ["A_feature", "B2_outcome_number", "B_outcome", "C_social", "D_urgency"], "click": null, "interest": {"B_outcome": 2, "A_feature": 3, "C_social": 2, "B2_outcome_number": 2, "D_urgency": 1}, "reasoning": "I\u2019m not buying the 'founder' hype or the self-reported stats in Ad 4, especially since I already pay for two subscriptions and can't afford another $9/month without a clear, immediate ROI. Ad   const N = D.variants.length, by = D.variants.slice().sort((x, y) => x.rank2 - y.rank2), top = by[0], last = by[N - 1];
  const lastCount = id => D.people.filter(p => p.r2.ranking[N - 1] === id).length;
  const firstFan = id => D.people.find(p => p.r1.ranking[0] === id);
  const lastFan = id => D.people.find(p => p.r1.ranking[N - 1] === id);
  const winners = D.segments.map(s => { const w = D.variants.slice().sort((x, y) => s.rank2[x.id] - s.rank2[y.id])[0]; return `<tr><td>${esc(s.name)}</td><td>${esc(w.name)}</td><td class="mono">${f2(s.rank2[w.id])}</td></tr>`; }).join("");
  const passes = D.checks.r2.filter(c => c.pass).length, tot = D.checks.r2.length;
  const q1 = firstFan(top.id), q2 = lastFan(last.id);
  return `<article class="card" data-step="3"><div class="ch"><span class="no">04</span><h2>Prediction report</h2><span class="badge ok">COMPLETED</span></div>
    <div class="doc">
      <span class="kicker">PREDICTION REPORT</span>
      <h3>${esc(D.title)}: which wording wins?</h3>
      <p class="lede">${D.n} synthetic shoppers ranked ${N} ad wordings alone, then again after reading peers. "${esc(top.name)}" ranked best on average (${f2(top.rank2)}); "${esc(last.name)}" ranked worst (${f2(last.rank2)}), last for ${lastCount(last.id)} of ${D.n} personas. ${passes} of ${tot} success tests passed after peers.</p>
      <h4><em>01</em> Hypothesis check</h4><p>${esc(D.hypothesis)}</p>${checks()}
      <h4><em>02</em> Where each ad landed</h4>${dumbbell()}
      <h4><em>03</em> Best ad per audience segment</h4>
      <div class="scroll"><table><thead><tr><th>SEGMENT</th><th>BEST AD AFTER PEERS</th><th>AVG POSITION</th></tr></thead><tbody>${winners}</tbody></table></div>
      <h4><em>04</em> Segment by ad</h4>${heat()}
      <h4><em>05</em> In their words</h4>${q1 ? quote(q1, 1) : ""}${q2 ? quote(q2, 1) : ""}
      ${D.assumptions.length ? `<h4><em>06</em> Assumptions behind this run</h4><ul>${D.assumptions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
      <h4><em>${D.assumptions.length ? "07" : "06"}</em> Limits of this run</h4>
      <ul><li>Simulated shoppers filter wording cheaply. They do not predict real conversion; confirm winners with a live A/B test.</li><li>With ${D.n} personas, gaps under about 0.4 places are noise.</li><li>Peer comments moved "would click none" from ${pct(D.none1)} to ${pct(D.none2)}.</li></ul>
      <button class="btn" id="todeep">Go to deep interaction</button>
    </div></article>`;
}

function stepChat() {
  return `<article class="card" data-step="4"><div class="ch"><span class="no">05</span><h2>Deep interaction</h2><span class="badge">REPLAY</span></div>
    <div class="api">Answers replayed from out/results.json</div>
    <p class="desc">Pick a persona and ask a question. Answers are the ones this persona gave during the simulation. Live chat needs the local model running.</p>
    <select id="who" aria-label="Persona">${D.people.map(p => `<option value="${p.id}">${esc(p.name)} (${esc(SEG[p.segment])})</option>`).join("")}</select>
    <div class="chips" id="qs"><button class="chip" data-q="0">Which ad would you click, and why?</button><button class="chip" data-q="1">What is your biggest doubt?</button><button class="chip" data-q="2">Did the peers change your mind?</button></div>
    <div class="chat" id="chat"><div class="bub p"><small>PERSONA</small>Ask me about the ads.</div></div>
    <div class="fakein"><input disabled placeholder="Live chat is available when run locally with Ollama" aria-label="Chat input (disabled)"></div></article>`;
}

function renderSteps() {
  $("#steps").innerHTML = stepGraph() + stepPersonas() + stepSim() + stepReport() + stepChat();
  feed(1);
}
function feed(r) {
  $("#feed").innerHTML = D.people.map(p => evRow(p, r)).join("");
  $$("#rtabs .tab").forEach(t => t.setAttribute("aria-pressed", String(+t.dataset.r === r)));
}
function ask(q) {
  const p = P[$("#who").value], c = $("#chat");
  const qtext = ["Which ad would you click, and why?", "What is your biggest doubt?", "Did the peers change your mind?"][q];
  let ans;
  if (q === 0) ans = `${p.r1.click ? "I would click " + V[p.r1.click].name + ". " : "I would click none of them. "}${p.r1.reasoning}`;
  else if (q === 1) ans = p.r1.objection || "I did not name a specific doubt.";
  else ans = `${changed(p) ? "Yes, I reordered my ranking." : "No, my ranking stayed the same."} ${p.r2.reasoning}`;
  c.insertAdjacentHTML("beforeend", `<div class="bub u">${esc(qtext)}</div><div class="bub p"><small>${esc(p.name.toUpperCase())}</small>${esc(ans)}</div>`);
  c.scrollTop = c.scrollHeight;
}

/* ---------------- wiring ---------------- */
function init() {
  layout(7); legend(); drawGraph(); renderSteps();
  $("#conlog").innerHTML = D.log.map((l, i) => `<span class="k">${String(i + 1).padStart(2, "0")}</span>  ${esc(l)}`).join("\n");
  $("#conmeta").textContent = D.logname; $("#proj").textContent = "/ " + D.title;
  $("#conlog").scrollTop = 0;

  $("#viewseg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    $("#shell").dataset.view = b.dataset.v; $$("#viewseg button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
  $("#gfull").onclick = () => { const s = $("#shell"), on = s.dataset.view !== "graph"; s.dataset.view = on ? "graph" : "split"; $("#gfull").textContent = on ? "Collapse" : "Expand";
    $$("#viewseg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === s.dataset.view))); };
  $("#relayout").onclick = () => { layout(Math.floor(Math.random() * 9000) + 2); drawGraph(); };
  $("#showp").onchange = e => { showP = e.target.checked; if (!showP && selected && byId[selected].type === "persona") showDetail(null); else drawGraph(); };
  $("#gsvg").addEventListener("click", e => { const g = e.target.closest("[data-id]"); showDetail(g ? g.dataset.id : null); });
  $("#gsvg").addEventListener("keydown", e => { if (e.key === "Enter") { const g = e.target.closest("[data-id]"); if (g) showDetail(g.dataset.id); } });
  $("#conhead").onclick = () => { const c = $("#console"); c.classList.toggle("closed"); $("#conhead").setAttribute("aria-expanded", String(!c.classList.contains("closed"))); };

  $("#steps").addEventListener("click", e => {
    const pc = e.target.closest(".pc"); if (pc) { showDetail("p:" + pc.dataset.id); if (!showP) { $("#showp").checked = showP = true; drawGraph(); } return; }
    const f = e.target.closest("#pfilter .chip"); if (f) { $$("#pfilter .chip").forEach(c => c.setAttribute("aria-pressed", String(c === f)));
      $$("#pgrid .pc").forEach(c => c.hidden = f.dataset.f !== "all" && c.dataset.seg !== f.dataset.f); return; }
    const t = e.target.closest("#rtabs .tab"); if (t) { feed(+t.dataset.r); return; }
    const q = e.target.closest("#qs .chip"); if (q) { ask(+q.dataset.q); return; }
    if (e.target.id === "todeep") $("[data-step='4']").scrollIntoView({ block: "start" });
  });

  // step indicator follows the scroll position of the workbench
  const root = window.matchMedia("(max-width: 860px)").matches ? null : $("#steps");
  const io = new IntersectionObserver(es => { es.forEach(en => { if (en.isIntersecting) { const i = +en.target.dataset.step; $("#stepno").textContent = (i + 1) + "/5"; $("#stepname").textContent = STEPS[i]; } }); },
    { root, rootMargin: "0px 0px -65% 0px", threshold: 0 });
  $$("[data-step]").forEach(c => io.observe(c));
}
init();
</script>
