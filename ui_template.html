<title>SimMarketing Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: MiroFish-style console. Top bar with view switch + step status; graph pane left, step workbench right; black log panel under the workbench. */
:root {
  --bg: #ffffff; --panel: #fafafa; --ink: #111111; --ink2: #4d4d4d; --muted: #6f6f6f;
  --line: #e4e4e4; --line2: #cfcfcf; --accent: #e2522b; --accent-wash: #fdeee9; --navy: #1f3a5f;
  --good: #1a8f3c; --bad: #c43a3a; --blue-wash: #eaf1fb; --grid: #ececec; --console: #0b0b0b; --console-ink: #b9b9b9;
  --n-product: #2a78d6; --n-feature: #1baf7a; --n-price: #eda100; --n-audience: #e87ba4; --n-claim: #6250d6;
  --n-limitation: #e34948; --n-ad: #eb6834; --n-persona: #8a8f98; --edge: #c9ccd1; --edge-hot: #e2522b;
  --heat-best: #184f95; --heat-worst: #dbe9fa; --on-best: #ffffff; --on-worst: #111111;
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e0e; --panel: #151515; --ink: #f0f0ee; --ink2: #c4c4c0; --muted: #9a9a96;
    --line: #262626; --line2: #3a3a3a; --accent: #f0714d; --accent-wash: #2d1a14; --navy: #9ec5f4;
    --good: #4cc56c; --bad: #ee7676; --blue-wash: #14223a; --grid: #1c1c1c; --console: #050505; --console-ink: #a8a8a8;
    --n-product: #3987e5; --n-feature: #199e70; --n-price: #c98500; --n-audience: #d55181; --n-claim: #9085e9;
    --n-limitation: #e66767; --n-ad: #d95926; --n-persona: #9a9fa8; --edge: #3a3d42; --edge-hot: #f0714d;
    --heat-best: #9ec5f4; --heat-worst: #184f95; --on-best: #0e0e0e; --on-worst: #f0f0ee; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e0e; --panel: #151515; --ink: #f0f0ee; --ink2: #c4c4c0; --muted: #9a9a96;
  --line: #262626; --line2: #3a3a3a; --accent: #f0714d; --accent-wash: #2d1a14; --navy: #9ec5f4;
  --good: #4cc56c; --bad: #ee7676; --blue-wash: #14223a; --grid: #1c1c1c; --console: #050505; --console-ink: #a8a8a8;
  --n-product: #3987e5; --n-feature: #199e70; --n-price: #c98500; --n-audience: #d55181; --n-claim: #9085e9;
  --n-limitation: #e66767; --n-ad: #d95926; --n-persona: #9a9fa8; --edge: #3a3d42; --edge-hot: #f0714d;
  --heat-best: #9ec5f4; --heat-worst: #184f95; --on-best: #0e0e0e; --on-worst: #f0f0ee; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
.mono { font-family: var(--mono); }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; flex: none; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.brand { font: 700 14px/1 var(--mono); letter-spacing: .08em; white-space: nowrap; }
.brand span { font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 10px; }
@media (max-width: 1100px) { .brand span { display: none; } }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; font: 500 12px/1 var(--font); border-radius: 6px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.seg button:focus-visible, .chip:focus-visible, .tab:focus-visible, .ghost:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { display: flex; align-items: center; gap: 10px; font: 12px/1 var(--mono); color: var(--ink2); white-space: nowrap; }
.status b { font-weight: 500; color: var(--ink); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }

/* panes */
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
.shell[data-view="graph"] { grid-template-columns: 1fr 0fr; }
.shell[data-view="work"] { grid-template-columns: 0fr 1fr; }
.shell[data-view="graph"] .work, .shell[data-view="work"] .graphpane { display: none; }
.graphpane { position: relative; border-right: 1px solid var(--line); min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 18px 18px; }
.gtitle { position: absolute; left: 14px; top: 12px; font: 500 12px/1 var(--mono); z-index: 2; }
.gtools { position: absolute; right: 12px; top: 8px; display: flex; gap: 6px; z-index: 2; }
.ghost { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; font: 500 11.5px/1 var(--mono); cursor: pointer; color: var(--ink2); }
.ghost:hover { border-color: var(--line2); color: var(--ink); }
#gsvg { flex: 1; min-height: 0; width: 100%; display: block; touch-action: manipulation; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-width: calc(100% - 24px); z-index: 2; }
.legend h4 { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; color: var(--accent); margin-bottom: 8px; }
.legend div { display: flex; flex-wrap: wrap; gap: 5px 14px; font-size: 12px; color: var(--ink2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.legend i.sq { border-radius: 2px; }
.legend label { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--ink2); cursor: pointer; }
.detail { position: absolute; right: 12px; top: 46px; width: min(300px, calc(100% - 24px)); max-height: calc(100% - 140px); overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.12); z-index: 3; font-size: 12.5px; }
.detail[hidden] { display: none; }
.dh { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; }
.dh button { border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted); padding: 0 2px; }
.tpill { color: #fff; font: 500 10.5px/1 var(--mono); padding: 4px 8px; border-radius: 99px; margin-left: auto; margin-right: 8px; }
.dbody { padding: 10px 12px; display: grid; gap: 8px; }
.kv { display: grid; grid-template-columns: 78px 1fr; gap: 8px; }
.kv span:first-child { color: var(--muted); }
.dbody .sum { color: var(--ink2); line-height: 1.55; }

/* workbench */
.work { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.steps { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ch { display: flex; align-items: baseline; gap: 10px; }
.ch .no { font: 500 13px/1 var(--mono); color: var(--accent); }
.ch h2 { font-size: 15px; font-weight: 600; flex: 1; }
.badge { font: 500 10.5px/1 var(--mono); letter-spacing: .04em; border: 1px solid var(--line2); border-radius: 4px; padding: 4px 7px; color: var(--ink2); white-space: nowrap; }
.badge.ok { color: var(--good); border-color: var(--good); }
.api { font: 11.5px/1.4 var(--mono); color: var(--muted); }
.desc { color: var(--ink2); font-size: 13px; max-width: 70ch; }
.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.trio div { padding: 12px; text-align: center; border-left: 1px solid var(--line); }
.trio div:first-child { border-left: 0; }
.trio b { display: block; font: 500 24px/1.1 var(--mono); }
.trio span { font-size: 11.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink2); border-radius: 99px; padding: 6px 11px; font: 500 12px/1 var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.tag i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; max-height: 420px; overflow: auto; padding: 2px; }
.pc { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pc:hover, .pc.sel { border-color: var(--accent); }
.pc .n { font-weight: 600; font-size: 13px; }
.pc .h { font: 11px/1.3 var(--mono); color: var(--muted); }
.pc .t { font-size: 11px; font: 500 10.5px/1 var(--mono); color: var(--accent); }
.pc p { font-size: 12px; color: var(--ink2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cfg { display: grid; border: 1px solid var(--line); border-radius: 8px; }
.cfg div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.cfg div:first-child { border-top: 0; }
.cfg span:last-child { font: 12.5px/1.5 var(--mono); text-align: right; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--line); background: var(--bg); padding: 6px 12px; border-radius: 6px; font: 500 12px/1 var(--mono); cursor: pointer; color: var(--muted); }
.tab[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.feed { display: grid; gap: 8px; max-height: 380px; overflow: auto; padding-right: 4px; }
.ev { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; background: var(--panel); }
.ev .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 500 11px/1.2 var(--mono); color: var(--muted); }
.ev .top b { color: var(--ink); font-weight: 500; }
.ev p { font-size: 12.5px; color: var(--ink2); }
.rk { display: inline-flex; gap: 3px; }
.rk span { font: 500 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 4px; background: var(--blue-wash); color: var(--ink2); }
.rk span.t1 { background: var(--ink); color: var(--bg); }

/* report */
.doc { display: grid; gap: 14px; }
.doc .kicker { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; border: 1px solid var(--ink); display: inline-block; padding: 4px 7px; width: fit-content; }
.doc h3 { font-size: clamp(20px, 3.2vw, 26px); line-height: 1.2; font-weight: 600; text-wrap: balance; }
.doc .lede { font-style: italic; color: var(--muted); font-size: 14px; border-left: 2px solid var(--line2); padding-left: 12px; max-width: 65ch; }
.doc h4 { font-size: 14px; font-weight: 600; display: flex; gap: 10px; }
.doc h4 em { font: 500 12px/1.6 var(--mono); color: var(--muted); font-style: normal; }
.doc p, .doc li { font-size: 13.5px; color: var(--ink2); max-width: 68ch; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
blockquote { margin: 0; padding: 8px 12px; background: var(--panel); border-left: 2px solid var(--line2); font-size: 12.5px; color: var(--ink2); font-style: italic; }
blockquote cite { display: block; font: 11px/1.4 var(--mono); font-style: normal; color: var(--muted); margin-top: 4px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 11px/1.3 var(--mono); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 99px; white-space: nowrap; }
.pill.pass { color: var(--good); background: color-mix(in oklab, var(--good) 14%, transparent); }
.pill.fail { color: var(--bad); background: color-mix(in oklab, var(--bad) 14%, transparent); }
.det { display: block; color: var(--muted); font: 11px/1.4 var(--mono); margin-top: 3px; }
.drow { padding: 8px 0; border-top: 1px solid var(--line); }
.drow:first-child { border-top: 0; }
.dl { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 13px; }
.dl span { font: 11.5px/1.5 var(--mono); color: var(--muted); }
.track { position: relative; height: 24px; margin: 0 8px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: var(--line2); }
.span { position: absolute; top: 10px; height: 4px; background: var(--accent); opacity: .35; border-radius: 2px; }
.dt { position: absolute; top: 4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; }
.dt.a { border: 2px solid var(--accent); background: var(--bg); }
.dt.b { background: var(--accent); border: 2px solid var(--bg); }
.axis { display: flex; justify-content: space-between; margin: 4px 8px 0; font: 11px/1 var(--mono); color: var(--muted); }
.lg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink2); }
.lg i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.lg i.a { border: 2px solid var(--accent); } .lg i.b { background: var(--accent); }
.heat td { padding: 3px; border: 0; text-align: center; } .heat th { border: 0; text-align: center; padding: 3px 3px 6px; }
.heat td:first-child, .heat th:first-child { text-align: left; }
.cell { font: 500 12.5px/1 var(--mono); border-radius: 5px; padding: 10px 4px; min-width: 52px; }
.btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 12px 14px; font: 500 13px/1 var(--font); cursor: pointer; width: 100%; }

/* chat */
select { font: 500 13px/1 var(--font); border: 1px solid var(--line2); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; max-width: 100%; }
.chat { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--panel); max-height: 360px; overflow: auto; }
.bub { max-width: 88%; padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
.bub.u { justify-self: end; background: var(--ink); color: var(--bg); }
.bub.p { justify-self: start; background: var(--bg); border: 1px solid var(--line); color: var(--ink2); }
.bub small { display: block; font: 10.5px/1.2 var(--mono); color: var(--muted); margin-bottom: 4px; }
.fakein { display: flex; gap: 8px; }
.fakein input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; font: 13px var(--font); color: var(--muted); }

/* console */
.console { flex: none; background: var(--console); color: var(--console-ink); border-top: 1px solid var(--line); }
.console header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; color: #8a8a8a; cursor: pointer; border: 0; width: 100%; background: transparent; text-align: left; }
.console pre { margin: 0; padding: 0 14px 12px; font: 11.5px/1.65 var(--mono); height: 120px; overflow: auto; white-space: pre; }
.console.closed pre { display: none; }
.console pre .k { color: #6f6f6f; }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; }
  html { height: auto; }
  .shell, .shell[data-view="graph"], .shell[data-view="work"], .shell[data-view="split"] { display: block; }
  .graphpane { height: 62vh; min-height: 380px; border-right: 0; border-bottom: 1px solid var(--line); }
  .steps { overflow: visible; }
  .status span.long { display: none; }
  .console pre { height: 90px; }
}
@media (max-width: 520px) { .brand { font-size: 12px; } .seg button { padding: 6px 9px; } .status { display: none; } }
@media (prefers-reduced-motion: reduce) { .steps { scroll-behavior: auto; } }
</style>

<div class="bar">
  <div class="brand">SIMMARKETING<span id="proj"></span></div>
  <div class="seg" id="viewseg" role="group" aria-label="View"><button data-v="graph" aria-pressed="false">Graph</button><button data-v="split" aria-pressed="true">Split</button><button data-v="work" aria-pressed="false">Workbench</button></div>
  <div class="status"><span>Step <b id="stepno">1/5</b> <b id="stepname" class="long">Graph build</b></span><span><i class="dot"></i>Completed</span></div>
</div>

<div class="shell" id="shell" data-view="split">
  <section class="graphpane" aria-label="Graph relationship visualization">
    <div class="gtitle">Graph Relationship Visualization</div>
    <div class="gtools"><button class="ghost" id="relayout">Re-layout</button><button class="ghost" id="gfull">Expand</button></div>
    <svg id="gsvg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Knowledge graph of the product brief, ad variants and personas"></svg>
    <div class="legend"><h4>ENTITY TYPES</h4><div id="legend"></div><label><input type="checkbox" id="showp" checked> Show personas and their top-ranked ad</label></div>
    <div class="detail" id="detail" hidden></div>
  </section>

  <section class="work">
    <div class="steps" id="steps"></div>
    <div class="console" id="console"><header id="conhead" aria-expanded="true"><span>CONSOLE OUTPUT</span><span id="conmeta"></span></header><pre id="conlog"></pre></div>
  </section>
</div>

<script>
const D = __DATA__;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f2 = x => x.toFixed(2);
const pct = x => Math.round(x * 100) + "%";
const V = Object.fromEntries(D.variants.map(v => [v.id, v]));
const P = Object.fromEntries(D.people.map(p => [p.id, p]));
const SEG = Object.fromEntries(D.segments.map(s => [s.id, s.name]));
const short = id => id.split("_")[0];
const clip = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const changed = p => p.r1.ranking.join() !== p.r2.ranking.join();
const NCHANGED = D.people.filter(changed).length;
const TYPECOLOR = { product: "--n-product", feature: "--n-feature", price: "--n-price", audience: "--n-audience", claim: "--n-claim", limitation: "--n-limitation", ad: "--n-ad", persona: "--n-persona" };

/* ---------------- graph data + layout ---------------- */
const nodes = [], edges = [], byId = {};
function addNode(n) { byId[n.id] = n; nodes.push(n); }
D.graph.nodes.forEach(n => addNode({ id: "b:" + n.id, label: n.id, type: n.type, kind: "brief" }));
D.variants.forEach(v => addNode({ id: "a:" + v.id, label: short(v.id), type: "ad", kind: "ad", v }));
D.people.forEach(p => addNode({ id: "p:" + p.id, label: p.name, type: "persona", kind: "persona", p }));
const prod = nodes.find(n => n.type === "product");
D.graph.edges.forEach(e => { if (byId["b:" + e.src] && byId["b:" + e.dst]) edges.push({ s: "b:" + e.src, t: "b:" + e.dst, rel: String(e.rel).replace(/_/g, " "), kind: "brief" }); });
if (prod) D.variants.forEach(v => edges.push({ s: "a:" + v.id, t: prod.id, rel: "promotes", kind: "ad" }));
D.people.forEach(p => edges.push({ s: "p:" + p.id, t: "a:" + p.r2.ranking[0], rel: "ranks first", kind: "pref" }));

function layout(seed) {
  let r = seed || 1; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  nodes.forEach((n, i) => { const a = rnd() * 6.283, d = 80 + rnd() * 260; n.x = 450 + Math.cos(a) * d; n.y = 350 + Math.sin(a) * d * .75; n.vx = n.vy = 0; });
  for (let it = 0; it < 420; it++) {
    const cool = 1 - it / 420;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j]; let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 0.01, d = Math.sqrt(d2);
      const f = 2600 / d2; dx /= d; dy /= d; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    }
    edges.forEach(e => {
      const a = byId[e.s], b = byId[e.t]; let dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const rest = e.kind === "pref" ? 130 : e.kind === "ad" ? 120 : 95, f = (d - rest) * 0.02; dx /= d; dy /= d;
      a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    });
    nodes.forEach(n => { n.vx += (450 - n.x) * 0.004; n.vy += (350 - n.y) * 0.006; n.x += Math.max(-12, Math.min(12, n.vx)) * cool; n.y += Math.max(-12, Math.min(12, n.vy)) * cool; n.vx *= 0.82; n.vy *= 0.82; });
  }
  nodes.forEach(n => { n.x = Math.max(40, Math.min(860, n.x)); n.y = Math.max(60, Math.min(640, n.y)); });
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y), pad = 60;
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad - 20, w = Math.max(...xs) - Math.min(...xs) + pad * 2, h = Math.max(...ys) - Math.min(...ys) + pad * 2 + 20;
  $("#gsvg").setAttribute("viewBox", `${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}`);
}

let selected = null, showP = true;
function neighbors(id) { const s = new Set([id]); edges.forEach(e => { if (e.s === id) s.add(e.t); if (e.t === id) s.add(e.s); }); return s; }

function drawGraph() {
  const nb = selected ? neighbors(selected) : null;
  const vis = n => showP || n.type !== "persona";
  const ev = e => vis(byId[e.s]) && vis(byId[e.t]);
  const eh = edges.filter(ev).map(e => {
    const a = byId[e.s], b = byId[e.t], hot = selected && (e.s === selected || e.t === selected);
    const dim = selected && !hot;
    return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="var(${hot ? "--edge-hot" : "--edge"})" stroke-width="${hot ? 1.8 : 1}" opacity="${dim ? .25 : 1}"/>`;
  }).join("");
  const nh = nodes.filter(vis).map(n => {
    const isSel = n.id === selected, dim = nb && !nb.has(n.id);
    const r = n.type === "persona" ? 5.5 : n.type === "product" ? 14 : n.type === "ad" ? 10 : 8;
    const col = `var(${TYPECOLOR[n.type]})`;
    const shape = n.type === "ad" ? `<rect x="${n.x - r}" y="${n.y - r}" width="${r * 2}" height="${r * 2}" rx="2" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`
      : `<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`;
    const ring = isSel ? `<circle cx="${n.x}" cy="${n.y}" r="${r + 5}" fill="none" stroke="var(--accent)" stroke-width="2"/>` : "";
    const showLabel = n.type !== "persona" || isSel || (nb && nb.has(n.id));
    const lab = showLabel ? `<text x="${n.x}" y="${n.y + r + 13}" text-anchor="middle" font-size="11" fill="var(--ink2)" paint-order="stroke" stroke="var(--bg)" stroke-width="3" stroke-linejoin="round">${esc(clip(n.label, 22))}</text>` : "";
    return `<g data-id="${esc(n.id)}" style="cursor:pointer" opacity="${dim ? .3 : 1}" tabindex="0" role="button" aria-label="${esc(n.type)}: ${esc(n.label)}">${ring}${shape}${lab}<circle cx="${n.x}" cy="${n.y}" r="${r + 7}" fill="transparent"/></g>`;
  }).join("");
  $("#gsvg").innerHTML = eh + nh;
}

function showDetail(id) {
  selected = id; drawGraph(); markPersona();
  const d = $("#detail"); if (!id) { d.hidden = true; return; }
  const n = byId[id], col = `var(${TYPECOLOR[n.type]})`;
  let body = "";
  if (n.kind === "persona") {
    const p = n.p;
    body = `<div class="kv"><span>Segment</span><span>${esc(SEG[p.segment])}</span></div><div class="kv"><span>Job</span><span>${esc(p.job)}</span></div>
      <div class="kv"><span>Household</span><span>${esc(p.household)}</span></div>${D.persona_fields.map(f => p[f.key] ? `<div class="kv"><span>${esc(f.label)}</span><span>${esc(p[f.key])}</span></div>` : "").join("")}
      <div class="kv"><span>Round 1</span><span class="rk">${p.r1.ranking.map((v, i) => `<span class="${i ? "" : "t1"}">${esc(short(v))}</span>`).join("")}</span></div>
      <div class="kv"><span>After peers</span><span class="rk">${p.r2.ranking.map((v, i) => `<span class="${i ? "" : "t1"}">${esc(short(v))}</span>`).join("")}</span></div>
      <div class="sum">${esc(p.bio)}</div>`;
  } else if (n.kind === "ad") {
    body = `<div class="kv"><span>Avg position</span><span>${f2(n.v.rank2)} after peers (${f2(n.v.rank1)} in round 1)</span></div><div class="sum">${esc(n.v.text)}</div>`;
  } else {
    const rel = edges.filter(e => (e.s === id || e.t === id) && e.kind === "brief").map(e => `${esc(byId[e.s].label)} <i>${esc(e.rel)}</i> ${esc(byId[e.t].label)}`);
    body = `<div class="kv"><span>Name</span><span>${esc(n.label)}</span></div><div class="kv"><span>Relations</span><span>${rel.length ? rel.join("<br>") : "none"}</span></div>`;
  }
  d.innerHTML = `<div class="dh"><span>${n.kind === "persona" ? "Persona" : n.kind === "ad" ? "Ad variant" : "Node details"}</span><span class="tpill" style="background:${col}">${esc(n.type)}</span><button aria-label="Close" id="dclose">&times;</button></div><div class="dbody">${body}</div>`;
  d.hidden = false; $("#dclose").onclick = () => showDetail(null);
}
function markPersona() { $$(".pc").forEach(c => c.classList.toggle("sel", "p:" + c.dataset.id === selected)); }

function legend() {
  const items = [["product", "Product"], ["feature", "Feature"], ["price", "Price"], ["audience", "Audience"], ["claim", "Claim"], ["limitation", "Limitation"], ["ad", "Ad variant"], ["persona", "Persona"]];
  const present = new Set(nodes.map(n => n.type));
  $("#legend").innerHTML = items.filter(i => present.has(i[0])).map(i => `<span><i class="${i[0] === "ad" ? "sq" : ""}" style="background:var(${TYPECOLOR[i[0]]})"></i>${i[1]}</span>`).join("");
}

/* ---------------- workbench steps ---------------- */
const STEPS = ["Graph build", "Environment setup", "Simulation", "Report", "Deep interaction"];

function stepGraph() {
  const types = {}; D.graph.nodes.forEach(n => types[n.type] = (types[n.type] || 0) + 1);
  const tags = Object.entries(types).map(([t, c]) => `<span class="tag"><i style="background:var(${TYPECOLOR[t]})"></i>${esc(t)} &middot; ${c}</span>`).join("");
  const rels = D.graph.edges.map(e => `<tr><td>${esc(e.src)}</td><td class="mono">${esc(String(e.rel).replace(/_/g, " "))}</td><td>${esc(e.dst)}</td></tr>`).join("");
  return `<article class="card" data-step="0"><div class="ch"><span class="no">01</span><h2>Knowledge graph from the product brief</h2><span class="badge ok">COMPLETED</span></div>
    <div class="api">seed/product.md &rarr; out/graph.json</div>
    <p class="desc">The local model read the brief and extracted entities and relations. Personas received these relations as the only verifiable facts about the product.</p>
    <div class="trio"><div><b>${D.graph.nodes.length}</b><span>Entities</span></div><div><b>${D.graph.edges.length}</b><span>Relations</span></div><div><b>${(D.graph.facts || []).length}</b><span>Checkable facts</span></div></div>
    <div class="chips">${tags}</div>
    <details><summary class="api" style="cursor:pointer">All ${D.graph.edges.length} relations</summary><div class="scroll"><table><tbody>${rels}</tbody></table></div></details></article>`;
}

function stepPersonas() {
  return `<article class="card" data-step="1"><div class="ch"><span class="no">02</span><h2>Persona generation</h2><span class="badge ok">COMPLETED</span></div>
    <div class="api">Local LLM &middot; ${esc(D.model)}</div>
    <p class="desc">${D.n / D.segments.length} shoppers per audience segment, each with a fixed name and life situation, their own means and attitudes. Select a card to find it in the graph.</p>
    <div class="trio"><div><b>${D.n}</b><span>Personas</span></div><div><b>${D.segments.length}</b><span>Segments</span></div><div><b>${D.variants.length}</b><span>Ads to judge</span></div></div>
    <div class="chips" id="pfilter"><button class="chip" aria-pressed="true" data-f="all">All</button>${D.segments.map(s => `<button class="chip" aria-pressed="false" data-f="${s.id}">${esc(s.name)}</button>`).join("")}</div>
    <div class="pgrid" id="pgrid">${D.people.map(p => `<button class="pc" data-id="${p.id}" data-seg="${p.segment}"><span class="t">${esc(SEG[p.segment]).toUpperCase()}</span><span class="n">${esc(p.name)}</span><span class="h">${p.age} &middot; ${esc(p.job)}</span><p>${esc(p.bio)}</p></button>`).join("")}</div></article>`;
}

function evRow(p, rnd) {
  const r = rnd === 1 ? p.r1 : p.r2, click = r.click ? V[r.click].name : "none";
  return `<div class="ev" data-r="${rnd}"><div class="top"><b>${esc(p.name)}</b><span>${esc(SEG[p.segment])}</span><span>ROUND ${rnd}</span><span class="rk">${r.ranking.map((v, i) => `<span class="${i ? "" : "t1"}">${esc(short(v))}</span>`).join("")}</span><span>click: ${esc(click)}</span>${rnd === 2 ? `<span>${changed(p) ? "changed ranking" : "unchanged"}</span>` : ""}</div><p>${esc(r.reasoning)}</p></div>`;
}
function stepSim() {
  const none = `${pct(D.none1)} &rarr; ${pct(D.none2)}`;
  return `<article class="card" data-step="2"><div class="ch"><span class="no">03</span><h2>Simulation: rank the ads, then read peers</h2><span class="badge ok">COMPLETED</span></div>
    <div class="api">2 rounds &middot; ${D.n * 2} model calls for the panel</div>
    <p class="desc">Round 1: each persona sees all ${D.variants.length} ads, shuffled and neutrally numbered, and ranks them. Round 2: each reads three peers' reactions and ranks again.</p>
    <div class="trio"><div><b>${NCHANGED}</b><span>Changed ranking</span></div><div><b>${none}</b><span>Would click none</span></div><div><b>3</b><span>Peers read each</span></div></div>
    <div class="cfg"><div><span>Model</span><span>${esc(D.model)}</span></div><div><span>Ads per persona</span><span>${D.variants.length}, shuffled per persona</span></div><div><span>Scale</span><span>rank 1-5, interest 1-5, click one or none</span></div></div>
    <div class="tabs" id="rtabs"><button class="tab" aria-pressed="true" data-r="1">ROUND 1</button><button class="tab" aria-pressed="false" data-r="2">ROUND 2</button></div>
    <div class="feed" id="feed"></div></article>`;
}

function dumbbell() {
  const rows = D.variants.slice().sort((a, b) => a.rank2 - b.rank2).map(v => {
    const x = r => (r - 1) / (D.variants.length - 1) * 100, lo = Math.min(v.rank1, v.rank2), hi = Math.max(v.rank1, v.rank2);
    return `<div class="drow"><div class="dl"><b>${esc(v.name)}</b><span>${f2(v.rank1)} &rarr; ${f2(v.rank2)}</span></div><div class="track"><div class="span" style="left:${x(lo)}%;width:${x(hi) - x(lo)}%"></div><div class="dt a" style="left:${x(v.rank1)}%"></div><div class="dt b" style="left:${x(v.rank2)}%"></div></div></div>`;
  }).join("");
  return `<div class="lg"><span><i class="a"></i>Round 1</span><span><i class="b"></i>After peers</span></div>${rows}<div class="axis">${D.variants.map((_, i) => `<span>${ord(i + 1)}</span>`).join("")}</div>`;
}
function heat() {
  const head = D.variants.map(v => `<th>${esc(v.name)}</th>`).join("");
  const rows = D.segments.map(s => `<tr><td>${esc(s.name)}</td>${D.variants.map(v => { const r = s.rank2[v.id], t = 1 - (r - 1) / (D.variants.length - 1);
    return `<td><div class="cell" style="background:color-mix(in oklab, var(--heat-best) ${(t * 100).toFixed(0)}%, var(--heat-worst));color:var(${t > .5 ? "--on-best" : "--on-worst"})">${f2(r)}</div></td>`; }).join("")}</tr>`).join("");
  return `<div class="scroll"><table class="heat"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function checks() {
  const rows = D.checks.r1.map((c, i) => { const b = D.checks.r2[i];
    const pill = x => `<span class="pill ${x.pass ? "pass" : "fail"}">${x.pass ? "&#10003; Pass" : "&#10005; Fail"}</span><span class="det">${esc(x.detail)}</span>`;
    return `<tr><td>${esc(c.label)}</td><td>${pill(c)}</td><td>${pill(b)}</td></tr>`; }).join("");
  return `<div class="scroll"><table><thead><tr><th>TEST</th><th>ROUND 1</th><th>AFTER PEERS</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function quote(p, rnd) { const r = rnd === 1 ? p.r1 : p.r2; return `<blockquote>&ldquo;${esc(clip(r.reasoning, 260))}&rdquo;<cite>${esc(p.name)} &middot; ${esc(SEG[p.segment])} &middot; round ${rnd}</cite></blockquote>`; }
function stepReport() {
  const N = D.variants.length, by = D.variants.slice().sort((x, y) => x.rank2 - y.rank2), top = by[0], last = by[N - 1];
  const lastCount = id => D.people.filter(p => p.r2.ranking[N - 1] === id).length;
  const firstFan = id => D.people.find(p => p.r1.ranking[0] === id);
  const lastFan = id => D.people.find(p => p.r1.ranking[N - 1] === id);
  const winners = D.segments.map(s => { const w = D.variants.slice().sort((x, y) => s.rank2[x.id] - s.rank2[y.id])[0]; return `<tr><td>${esc(s.name)}</td><td>${esc(w.name)}</td><td class="mono">${f2(s.rank2[w.id])}</td></tr>`; }).join("");
  const passes = D.checks.r2.filter(c => c.pass).length, tot = D.checks.r2.length;
  const q1 = firstFan(top.id), q2 = lastFan(last.id);
  return `<article class="card" data-step="3"><div class="ch"><span class="no">04</span><h2>Prediction report</h2><span class="badge ok">COMPLETED</span></div>
    <div class="doc">
      <span class="kicker">PREDICTION REPORT</span>
      <h3>${esc(D.title)}: which wording wins?</h3>
      <p class="lede">${D.n} synthetic shoppers ranked ${N} ad wordings alone, then again after reading peers. "${esc(top.name)}" ranked best on average (${f2(top.rank2)}); "${esc(last.name)}" ranked worst (${f2(last.rank2)}), last for ${lastCount(last.id)} of ${D.n} personas. ${passes} of ${tot} success tests passed after peers.</p>
      <h4><em>01</em> Hypothesis check</h4><p>${esc(D.hypothesis)}</p>${checks()}
      <h4><em>02</em> Where each ad landed</h4>${dumbbell()}
      <h4><em>03</em> Best ad per audience segment</h4>
      <div class="scroll"><table><thead><tr><th>SEGMENT</th><th>BEST AD AFTER PEERS</th><th>AVG POSITION</th></tr></thead><tbody>${winners}</tbody></table></div>
      <h4><em>04</em> Segment by ad</h4>${heat()}
      <h4><em>05</em> In their words</h4>${q1 ? quote(q1, 1) : ""}${q2 ? quote(q2, 1) : ""}
      ${D.assumptions.length ? `<h4><em>06</em> Assumptions behind this run</h4><ul>${D.assumptions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
      <h4><em>${D.assumptions.length ? "07" : "06"}</em> Limits of this run</h4>
      <ul><li>Simulated shoppers filter wording cheaply. They do not predict real conversion; confirm winners with a live A/B test.</li><li>With ${D.n} personas, gaps under about 0.4 places are noise.</li><li>Peer comments moved "would click none" from ${pct(D.none1)} to ${pct(D.none2)}.</li></ul>
      <button class="btn" id="todeep">Go to deep interaction</button>
    </div></article>`;
}

function stepChat() {
  return `<article class="card" data-step="4"><div class="ch"><span class="no">05</span><h2>Deep interaction</h2><span class="badge">REPLAY</span></div>
    <div class="api">Answers replayed from out/results.json</div>
    <p class="desc">Pick a persona and ask a question. Answers are the ones this persona gave during the simulation. Live chat needs the local model running.</p>
    <select id="who" aria-label="Persona">${D.people.map(p => `<option value="${p.id}">${esc(p.name)} (${esc(SEG[p.segment])})</option>`).join("")}</select>
    <div class="chips" id="qs"><button class="chip" data-q="0">Which ad would you click, and why?</button><button class="chip" data-q="1">What is your biggest doubt?</button><button class="chip" data-q="2">Did the peers change your mind?</button></div>
    <div class="chat" id="chat"><div class="bub p"><small>PERSONA</small>Ask me about the ads.</div></div>
    <div class="fakein"><input disabled placeholder="Live chat is available when run locally with Ollama" aria-label="Chat input (disabled)"></div></article>`;
}

function renderSteps() {
  $("#steps").innerHTML = stepGraph() + stepPersonas() + stepSim() + stepReport() + stepChat();
  feed(1);
}
function feed(r) {
  $("#feed").innerHTML = D.people.map(p => evRow(p, r)).join("");
  $$("#rtabs .tab").forEach(t => t.setAttribute("aria-pressed", String(+t.dataset.r === r)));
}
function ask(q) {
  const p = P[$("#who").value], c = $("#chat");
  const qtext = ["Which ad would you click, and why?", "What is your biggest doubt?", "Did the peers change your mind?"][q];
  let ans;
  if (q === 0) ans = `${p.r1.click ? "I would click " + V[p.r1.click].name + ". " : "I would click none of them. "}${p.r1.reasoning}`;
  else if (q === 1) ans = p.r1.objection || "I did not name a specific doubt.";
  else ans = `${changed(p) ? "Yes, I reordered my ranking." : "No, my ranking stayed the same."} ${p.r2.reasoning}`;
  c.insertAdjacentHTML("beforeend", `<div class="bub u">${esc(qtext)}</div><div class="bub p"><small>${esc(p.name.toUpperCase())}</small>${esc(ans)}</div>`);
  c.scrollTop = c.scrollHeight;
}

/* ---------------- wiring ---------------- */
function init() {
  layout(7); legend(); drawGraph(); renderSteps();
  $("#conlog").innerHTML = D.log.map((l, i) => `<span class="k">${String(i + 1).padStart(2, "0")}</span>  ${esc(l)}`).join("\n");
  $("#conmeta").textContent = D.logname; $("#proj").textContent = "/ " + D.title;
  $("#conlog").scrollTop = 0;

  $("#viewseg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    $("#shell").dataset.view = b.dataset.v; $$("#viewseg button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
  $("#gfull").onclick = () => { const s = $("#shell"), on = s.dataset.view !== "graph"; s.dataset.view = on ? "graph" : "split"; $("#gfull").textContent = on ? "Collapse" : "Expand";
    $$("#viewseg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === s.dataset.view))); };
  $("#relayout").onclick = () => { layout(Math.floor(Math.random() * 9000) + 2); drawGraph(); };
  $("#showp").onchange = e => { showP = e.target.checked; if (!showP && selected && byId[selected].type === "persona") showDetail(null); else drawGraph(); };
  $("#gsvg").addEventListener("click", e => { const g = e.target.closest("[data-id]"); showDetail(g ? g.dataset.id : null); });
  $("#gsvg").addEventListener("keydown", e => { if (e.key === "Enter") { const g = e.target.closest("[data-id]"); if (g) showDetail(g.dataset.id); } });
  $("#conhead").onclick = () => { const c = $("#console"); c.classList.toggle("closed"); $("#conhead").setAttribute("aria-expanded", String(!c.classList.contains("closed"))); };

  $("#steps").addEventListener("click", e => {
    const pc = e.target.closest(".pc"); if (pc) { showDetail("p:" + pc.dataset.id); if (!showP) { $("#showp").checked = showP = true; drawGraph(); } return; }
    const f = e.target.closest("#pfilter .chip"); if (f) { $$("#pfilter .chip").forEach(c => c.setAttribute("aria-pressed", String(c === f)));
      $$("#pgrid .pc").forEach(c => c.hidden = f.dataset.f !== "all" && c.dataset.seg !== f.dataset.f); return; }
    const t = e.target.closest("#rtabs .tab"); if (t) { feed(+t.dataset.r); return; }
    const q = e.target.closest("#qs .chip"); if (q) { ask(+q.dataset.q); return; }
    if (e.target.id === "todeep") $("[data-step='4']").scrollIntoView({ block: "start" });
  });

  // step indicator follows the scroll position of the workbench
  const root = window.matchMedia("(max-width: 860px)").matches ? null : $("#steps");
  const io = new IntersectionObserver(es => { es.forEach(en => { if (en.isIntersecting) { const i = +en.target.dataset.step; $("#stepno").textContent = (i + 1) + "/5"; $("#stepname").textContent = STEPS[i]; } }); },
    { root, rootMargin: "0px 0px -65% 0px", threshold: 0 });
  $$("[data-step]").forEach(c => io.observe(c));
}
init();
</script>
